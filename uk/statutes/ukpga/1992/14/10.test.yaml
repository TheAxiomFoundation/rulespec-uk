# Expected values are hand-derived from the section 5 printed proportion
# applied to a band D amount of £1,800, which is divisible by the band D term
# 9 so that every band amount is exact: one ninth of £1,800 is £200, so band A
# is 6 x £200 = £1,200, band B 7 x £200 = £1,400, and so on.
- name: band_d_dwelling_pays_the_authority_band_d_amount
  period:
    period_kind: custom
    name: financial_year
    start: '2026-04-01'
    end: '2027-03-31'
  input:
    uk:statutes/ukpga/1992/14/10#input.council_tax_band_d_amount_set_by_billing_authority_for_year: 1800
    uk:statutes/ukpga/1992/14/10#input.person_is_liable_to_pay_council_tax_for_chargeable_dwelling: true
    uk:statutes/ukpga/1992/14/5#input.council_tax_valuation_band_index: 3
    uk:statutes/ukpga/1992/14/5#input.dwelling_is_situated_in_wales: false
  output:
    uk:statutes/ukpga/1992/14/10#council_tax_amount_set_for_listed_band_for_year: 1800
    uk:statutes/ukpga/1992/14/10#council_tax_liability_for_year: 1800

