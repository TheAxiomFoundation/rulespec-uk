format: rulespec/v1
imports:
- uk:regulations/ssi/2012/319/14A#council_tax_reduction_before_regulation_14_comparison
inputs:
- name: relevant_person_is_liable_to_pay_council_tax_under_section_75
  entity: Person
  dtype: Boolean
  period: Day
- name: relevant_person_is_liable_for_council_tax_for_dwelling_as_sole_or_main_residence
  entity: Person
  dtype: Boolean
  period: Day
- name: regulation_15_applies
  entity: Person
  dtype: Boolean
  period: Day
- name: regulation_16_applies
  entity: Person
  dtype: Boolean
  period: Day
- name: regulation_19_applies
  entity: Person
  dtype: Boolean
  period: Day
- name: relevant_person_has_made_application_in_accordance_with_part_9
  entity: Person
  dtype: Boolean
  period: Day
- name: relevant_person_entitlement_to_council_tax_reduction_has_commenced
  entity: Person
  dtype: Boolean
  period: Day
- name: relevant_person_has_no_income
  entity: Person
  dtype: Boolean
  period: Day
- name: relevant_person_weekly_income
  entity: Person
  dtype: Money
  period: Week
  unit: GBP
- name: applicable_amount
  entity: Person
  dtype: Money
  period: Week
  unit: GBP
- name: appropriate_maximum_council_tax_reduction_exists
  entity: Person
  dtype: Boolean
  period: Day
- name: appropriate_maximum_council_tax_reduction
  entity: Person
  dtype: Money
  period: Day
  unit: GBP
- name: no_included_other_resident_is_liable_to_pay_rent_to_relevant_person
  entity: Person
  dtype: Boolean
  period: Day
- name: relevant_person_is_entitled_to_alternative_maximum_reduction_because_of_resident_income
  entity: Person
  dtype: Boolean
  period: Day
- name: appropriate_alternative_maximum_council_tax_reduction
  entity: Person
  dtype: Money
  period: Day
