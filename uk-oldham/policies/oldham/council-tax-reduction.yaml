format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-32
    # upstream_source_check:
      # status: delegated_scheme
      # checked_paths:
        # - uk/statutes/ukpga/1992/14/13A
        # - uk/regulations/uksi/2012/2885
        # - uk/regulations/uksi/2012/2886
      # rationale: Section 13A of the Local Government Finance Act 1992 delegates the working-age scheme to Oldham Metropolitan Borough Council, so its adopted scheme document is the operative legal source for the locally set working-age values.
  summary: |-
    Oldham's Full Council resolved on 4 March 2026 that the existing scheme remains unchanged for 2026/27. This working-age award surface therefore continues the 2025-26 instrument: liability is capped at Band A, reduced by 15 percent, then reduced by the printed excess-income amount and non-dependant deductions. Pension-age provisions and the detailed applicable-amount, income and capital schedules are outside this module.
  deferred_outputs:
    - output: uk-oldham:policies/oldham/council-tax-reduction/a#universal_credit_applicable_amount
      reason: The Universal Credit maximum-amount calculation in paragraph 25(a) is outside this award-surface module.
    - output: uk-oldham:policies/oldham/council-tax-reduction/paragraph-25-and-schedule-3#applicable_amount
      reason: Category-specific applicable amounts, premiums and Universal Credit maximum-amount calculation are outside this award-surface module.
    - output: uk-oldham:policies/oldham/council-tax-reduction/parts-10-and-12#assessed_income_and_capital
      reason: Detailed income, capital valuation, attribution and disregard rules are outside this award-surface module.
    - output: uk-oldham:policies/oldham/council-tax-reduction/paragraph-29-subparagraphs-3-to-6#non_dependant_exemption_and_household_aggregation
      reason: This module encodes every printed individual deduction band and consumes the household total; exemption, couple and apportionment classifiers remain future outputs.
rules:
  - name: oldham_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 28(2), continued for 2026-27
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: effective_period
            source:
              corpus_citation_path: uk-oldham/manual/council-minutes-2026-03-04/page-6
              excerpt: "That Council agrees that the existing Council Tax Reduction Scheme remains unchanged for 2026/27."
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-32
              excerpt: "100 per cent of the amount A/B less C"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: oldham_council_tax_reduction_award_reduction_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 28(2)(c), continued for 2026-27
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-32
              excerpt: "C is a 15 % reduction in award"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.15

  - name: oldham_council_tax_reduction_taper_whole_percentage_points
    kind: parameter
    dtype: Number
    period: Year
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 17(f)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-21
              excerpt: "amount B is 2 6/7 per cent"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          2

  - name: oldham_council_tax_reduction_taper_fraction_numerator
    kind: parameter
    dtype: Number
    period: Year
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 17(f)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-21
              excerpt: "amount B is 2 6/7 per cent"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6

  - name: oldham_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    period: Year
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 29(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-33
              excerpt: "£15.35 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          7

  - name: oldham_council_tax_reduction_per_cent_unit
    kind: parameter
    dtype: Rate
    period: Year
    source: Oldham Council Tax Reduction Scheme 2025-26 percentage notation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-32
              excerpt: "100 per cent of the amount A/B less C"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.01

  - name: oldham_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraphs 17(f)(ii) and 28(2), weekly rate derived from the printed daily mixed-number percentage
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-21
              excerpt: "amount B is 2 6/7 per cent of the difference between his income for the relevant week and"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-32
              excerpt: "the maximum council tax reduction payable to a person who is not a pensioner in respect of a day is 100 per cent of the amount A/B less C"
    versions:
      - effective_from: '2026-04-01'
        # (2 + 6/7) percent of weekly excess per day, multiplied by seven days.
        # Cancel the denominator before division to keep the weekly rate exact.
        formula: |-
          (oldham_council_tax_reduction_taper_whole_percentage_points * oldham_council_tax_reduction_days_per_week + oldham_council_tax_reduction_taper_fraction_numerator) * oldham_council_tax_reduction_per_cent_unit

  - name: oldham_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 22A
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-30
              excerpt: "any person whose capital exceeds £16,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          16000

  - name: oldham_council_tax_reduction_tariff_income_threshold
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 70(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-71
              excerpt: "£1 for each complete £250 in excess of £6,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6000

  - name: oldham_council_tax_reduction_tariff_income_step
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 70(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-71
              excerpt: "£1 for each complete £250 in excess of £6,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          250

  - name: oldham_council_tax_reduction_tariff_income_weekly_amount_per_step
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 70(1)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-71
              excerpt: "weekly income of £1 for each complete £250"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: oldham_council_tax_reduction_weeks_per_year
    kind: parameter
    dtype: Number
    period: Year
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 25(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-32
              excerpt: "divide the product by 52"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          52

  - name: oldham_council_tax_reduction_non_dependant_other_case_deduction_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 29
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-33
              excerpt: "in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.00 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          5.00

  - name: oldham_council_tax_reduction_non_dependant_remunerative_work_deduction_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 29
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-33
              excerpt: "in respect of a non-dependant aged 18 or over in remunerative work, £15.35 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          15.35

  - name: oldham_council_tax_reduction_non_dependant_low_income_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 29(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-33
              excerpt: "less than £266.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          266.00

  - name: oldham_council_tax_reduction_non_dependant_middle_income_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 29(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-33
              excerpt: "less than £463.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          463.00

  - name: oldham_council_tax_reduction_non_dependant_top_income_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 29(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-33
              excerpt: "less than £577.00"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          577.00

  - name: oldham_council_tax_reduction_non_dependant_middle_deduction_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 29(2)(b)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-33
              excerpt: "not less than £266.00, but less than £463.00, the deduction to be made under this section shall be £10.20 x1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          10.20

  - name: oldham_council_tax_reduction_non_dependant_high_deduction_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 29(2)(c)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-33
              excerpt: "not less than £463.00, but less than £577.00, the deduction to be made under this section shall be £12.80 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          12.80

  - name: oldham_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Oldham Council Tax Reduction Scheme 2025-26 class E
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-21
              excerpt: "Class E: persons who are not pensioners whose income is greater than the applicable amount."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_oldham and council_tax_reduction_household_in_england and oldham_council_tax_reduction_applicant_is_not_pensioner

  - name: oldham_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 22A
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-30
              excerpt: "any person whose capital exceeds £16,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          oldham_council_tax_reduction_assessed_capital_for_year <= oldham_council_tax_reduction_capital_limit

  - name: oldham_council_tax_reduction_tariff_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 70
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-71
              excerpt: "£1 for each complete £250 in excess of £6,000"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-71
              excerpt: "treated as equivalent to a weekly tariff income of £1."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if oldham_council_tax_reduction_assessed_capital_for_year > oldham_council_tax_reduction_tariff_income_threshold: ceil((oldham_council_tax_reduction_assessed_capital_for_year - oldham_council_tax_reduction_tariff_income_threshold) / oldham_council_tax_reduction_tariff_income_step) * oldham_council_tax_reduction_tariff_income_weekly_amount_per_step * oldham_council_tax_reduction_weeks_per_year else: oldham_council_tax_reduction_capital_limit - oldham_council_tax_reduction_capital_limit

  - name: oldham_council_tax_reduction_individual_non_dependant_deduction_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 29
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-33
              excerpt: "the non-dependant deductions in respect of a day referred to in section 28"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if oldham_council_tax_reduction_non_dependant_deduction_applies: if oldham_council_tax_reduction_non_dependant_in_remunerative_work: if oldham_council_tax_reduction_non_dependant_normal_gross_weekly_income < oldham_council_tax_reduction_non_dependant_low_income_threshold: oldham_council_tax_reduction_non_dependant_other_case_deduction_weekly else: if oldham_council_tax_reduction_non_dependant_normal_gross_weekly_income < oldham_council_tax_reduction_non_dependant_middle_income_threshold: oldham_council_tax_reduction_non_dependant_middle_deduction_weekly else: if oldham_council_tax_reduction_non_dependant_normal_gross_weekly_income < oldham_council_tax_reduction_non_dependant_top_income_threshold: oldham_council_tax_reduction_non_dependant_high_deduction_weekly else: oldham_council_tax_reduction_non_dependant_remunerative_work_deduction_weekly else: oldham_council_tax_reduction_non_dependant_other_case_deduction_weekly else: oldham_council_tax_reduction_capital_limit - oldham_council_tax_reduction_capital_limit

  - name: oldham_council_tax_reduction_band_a_capped_liability_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 28(2)(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-32
              excerpt: "A is the lower of either; i. amount set by the appropriate authority as the council tax"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-32
              excerpt: "ii. the amount set by the appropriate authority as the council tax for the relevant financial year in respect of a dwelling within Band A"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          min(oldham_council_tax_reduction_actual_liability_for_year, oldham_council_tax_reduction_band_a_liability_for_year)

  - name: oldham_council_tax_reduction_maximum_council_tax_reduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 28(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-32
              excerpt: "100 per cent of the amount A/B less C"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-32
              excerpt: "C is a 15 % reduction in award"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          oldham_council_tax_reduction_band_a_capped_liability_for_year * oldham_council_tax_reduction_maximum_support_rate * (oldham_council_tax_reduction_maximum_support_rate - oldham_council_tax_reduction_award_reduction_rate) - oldham_council_tax_reduction_non_dependant_deductions_for_year

  - name: oldham_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 17(f)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-21
              excerpt: "difference between his income for the relevant week and"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(oldham_council_tax_reduction_assessed_income_for_year + oldham_council_tax_reduction_tariff_income_for_year - oldham_council_tax_reduction_applicable_amount_for_year, oldham_council_tax_reduction_capital_limit - oldham_council_tax_reduction_capital_limit)

  - name: oldham_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 17(f)(ii)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-21
              excerpt: "amount B is 2 6/7 per cent of the difference between his income for the relevant week and"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          oldham_council_tax_reduction_excess_income_for_year * oldham_council_tax_reduction_weekly_taper_rate

  - name: oldham_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraphs 17 and 31
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-21
              excerpt: "in respect of whom amount A exceeds amount B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          oldham_council_tax_reduction_working_age_scheme_applies and oldham_council_tax_reduction_capital_eligible and would_claim_council_tax_reduction and oldham_council_tax_reduction_maximum_council_tax_reduction_for_year > oldham_council_tax_reduction_income_taper_deduction_for_year

  - name: oldham_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Oldham Council Tax Reduction Scheme 2025-26 paragraph 31(3)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-oldham/manual/council-tax-reduction-scheme-2025-26/page-37
              excerpt: "Where the person is within class B or E, that amount is the amount found by deducting amount B from amount A"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if oldham_council_tax_reduction_award_conditions_met: oldham_council_tax_reduction_maximum_council_tax_reduction_for_year - oldham_council_tax_reduction_income_taper_deduction_for_year else: oldham_council_tax_reduction_capital_limit - oldham_council_tax_reduction_capital_limit
inputs:
  - {name: local_authority_is_oldham, entity: Household, dtype: Boolean, period: Year}
  - {name: council_tax_reduction_household_in_england, entity: Household, dtype: Boolean, period: Year}
  - {name: oldham_council_tax_reduction_applicant_is_not_pensioner, entity: Household, dtype: Boolean, period: Year}
  - {name: would_claim_council_tax_reduction, entity: Household, dtype: Boolean, period: Year}
  - {name: oldham_council_tax_reduction_assessed_capital_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: oldham_council_tax_reduction_actual_liability_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
