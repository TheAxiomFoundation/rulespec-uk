format: rulespec/v1
module:
  proof_validation: {required: true}
  source_verification:
    corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-75
    # upstream_source_check:
      # status: delegated_scheme
      # checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
      # rationale: Section 13A delegates the working-age scheme to Cumberland Council, so its adopted scheme document is the operative legal source for locally set working-age values.
  summary: Cumberland's 2026/27 working-age means test provides a 100 percent maximum, capital and tariff-income rules, non-dependant deductions, and the printed 2 6/7 percent taper. Pension-age and applicable-amount schedules are outside this award-surface module.
  deferred_outputs:
    - output: uk-cumberland:policies/cumberland/council-tax-reduction/section-12#applicable_amount
      reason: Category-specific applicable amounts and premiums are not encoded by this award-surface module.
    - output: uk-cumberland:policies/cumberland/council-tax-reduction/sections-58-8#non_dependant_exemptions
      reason: This module encodes the deduction bands; the detailed exemption classifiers are future outputs.
rules:
  - name: cumberland_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 57.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "shall be 100 per cent, of the amount A divided by B"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '1'}]
  - name: cumberland_council_tax_reduction_per_cent_unit
    kind: parameter
    dtype: Rate
    source: Cumberland Council Tax Reduction Scheme 2026/27 percentage notation
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "100 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '0.01'}]
  - name: cumberland_council_tax_reduction_taper_whole_percentage_points
    kind: parameter
    dtype: Number
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 59.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-75, excerpt: "2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '2'}]
  - name: cumberland_council_tax_reduction_taper_fraction_numerator
    kind: parameter
    dtype: Number
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 59.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-75, excerpt: "2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '6'}]
  - name: cumberland_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 58.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "£15.95 x 1/7"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '7'}]
  - name: cumberland_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 59.1, derived from printed mixed-number percentage
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-75, excerpt: "shall be 2 6/7 per cent."}}]}}
    versions: [{effective_from: '2026-04-01', formula: '(cumberland_council_tax_reduction_taper_whole_percentage_points + cumberland_council_tax_reduction_taper_fraction_numerator / cumberland_council_tax_reduction_days_per_week) * cumberland_council_tax_reduction_per_cent_unit'}]
  - name: cumberland_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 33.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-55, excerpt: "the prescribed amount is £16,000 and no support shall be granted when the applicant has an amount greater that this level"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '16000'}]
  - name: cumberland_council_tax_reduction_tariff_income_threshold
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 42.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-60, excerpt: "exceeds £6,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '6000'}]
  - name: cumberland_council_tax_reduction_tariff_income_step
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 42.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-60, excerpt: "£1 for each complete £250"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '250'}]
  - name: cumberland_council_tax_reduction_tariff_income_weekly_amount_per_step
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 42.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-60, excerpt: "weekly income of £1 for each complete £250"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '1'}]
  - name: cumberland_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: cumberland_council_tax_reduction_non_dependant_band
    source: Cumberland Council Tax Reduction Scheme 2026/27 sections 58.1-58.2
    metadata: {proof: {atoms: [{path: 'versions[0].values', kind: parameter_table, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "58.1 Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 29 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7. 58.2 In the case of a non-dependant aged 18 or over, where it is shown to the appropriate authority that his normal gross weekly income is– (a) less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7; (c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7;", table: {header: Working-age non-dependant deductions, row_key: income band, column_key: weekly deduction}}}]}}
    versions: [{effective_from: '2026-04-01', values: {0: 5.20, 1: 10.60, 2: 13.30, 3: 15.95}}]
  - name: cumberland_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 33.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-55, excerpt: "no support shall be granted when the applicant has an amount greater that this level"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'cumberland_council_tax_reduction_assessed_capital_for_year <= cumberland_council_tax_reduction_capital_limit'}]
  - name: cumberland_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Cumberland Council Tax Reduction Scheme 2026/27 sections 1.6-1.7
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-8, excerpt: "this scheme only applies to a person who; (a) has not attained the qualifying age for state pension credit; or (b) has attained the qualifying age for state pension credit if he, and his partner, is a person on income support, on an income-based jobseeker’s allowance, on an income-related employment and support allowance or on universal credit."}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'cumberland_council_tax_reduction_applicant_is_working_age or cumberland_council_tax_reduction_receives_income_support or cumberland_council_tax_reduction_receives_income_based_jobseekers_allowance or cumberland_council_tax_reduction_receives_income_related_employment_and_support_allowance or cumberland_council_tax_reduction_receives_universal_credit'}]
  - name: cumberland_council_tax_reduction_receives_passported_income_related_benefit
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 1.7 Class D
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-8, excerpt: "the applicant or partner is in receipt of income support, jobseekers’ allowance (income based) or employment and support allowance (income related)"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'cumberland_council_tax_reduction_receives_income_support or cumberland_council_tax_reduction_receives_income_based_jobseekers_allowance or cumberland_council_tax_reduction_receives_income_related_employment_and_support_allowance'}]
  - name: cumberland_council_tax_reduction_tariff_income_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Cumberland Council Tax Reduction Scheme 2026/27 sections 42.1-42.2
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-60, excerpt: "Where the applicant’s capital calculated in accordance with this scheme exceeds £6,000 it shall be treated as equivalent to a weekly income of £1 for each complete £250 of in excess of £6,000 but not exceeding £16,000 42.2 Notwithstanding paragraph 42.1 where any part of the excess is not a complete £250 that part shall be treated as equivalent to a weekly tariff income of £1."}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'if cumberland_council_tax_reduction_assessed_capital_for_year > cumberland_council_tax_reduction_tariff_income_threshold: ceil((min(cumberland_council_tax_reduction_assessed_capital_for_year, cumberland_council_tax_reduction_capital_limit) - cumberland_council_tax_reduction_tariff_income_threshold) / cumberland_council_tax_reduction_tariff_income_step) * cumberland_council_tax_reduction_tariff_income_weekly_amount_per_step else: 0'}]
  - name: cumberland_council_tax_reduction_excess_income_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 59.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-75, excerpt: "excess of income over the applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'max(0, cumberland_council_tax_reduction_assessed_income_weekly + cumberland_council_tax_reduction_tariff_income_weekly - cumberland_council_tax_reduction_applicable_amount_weekly)'}]
  - name: cumberland_council_tax_reduction_maximum_amount_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 57.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "shall be 100 per cent, of the amount A divided by B"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'cumberland_council_tax_reduction_liability_weekly * cumberland_council_tax_reduction_maximum_support_rate - cumberland_council_tax_reduction_non_dependant_deductions_weekly'}]
  - name: cumberland_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Week
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 1.7 Classes D-E
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-8, excerpt: "be liable to pay council tax in respect of a dwelling in which he is solely or mainly resident; (d) is not deemed to be absent from the dwelling; (e) not fall within a class of person prescribed for the purposes of paragraph 2(9) of Schedule 1A to the Local Government Finance Act 1992 and excluded from the authority’s scheme; (f) be somebody in respect of whom a maximum Council Tax Reduction2 amount can be calculated; (g) not have capital savings above £16,0003; (h) be a person in respect of whom a day in which s/he is liable to pay council tax falls within a week in respect of which the person’s income4 is less than their applicable amount5 or the applicant or partner is in receipt of income support, jobseekers’ allowance (income based) or employment and support allowance (income related); and (i) has made a valid application for reduction6."}}, {path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-9, excerpt: "be a person in respect of whom a day in which s/he is liable to pay council tax falls within a week in respect of which the person’s income10 is more than their applicable amount11; (i) have made a valid application for reduction12; (j) be a person in respect of whom amount A exceeds amount B where (i) amount A is the maximum Council Tax Reduction in respect of the day in the applicant’s case; and\n\n(ii) amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount."}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'cumberland_council_tax_reduction_working_age_scheme_applies and cumberland_council_tax_reduction_applicant_is_liable_for_council_tax and cumberland_council_tax_reduction_applicant_resides_in_dwelling and cumberland_council_tax_reduction_applicant_is_not_deemed_absent and cumberland_council_tax_reduction_applicant_is_not_excluded_from_scheme and cumberland_council_tax_reduction_maximum_amount_can_be_calculated and cumberland_council_tax_reduction_capital_eligible and cumberland_council_tax_reduction_has_valid_application and (cumberland_council_tax_reduction_receives_passported_income_related_benefit or cumberland_council_tax_reduction_assessed_income_weekly + cumberland_council_tax_reduction_tariff_income_weekly < cumberland_council_tax_reduction_applicable_amount_weekly or (cumberland_council_tax_reduction_assessed_income_weekly + cumberland_council_tax_reduction_tariff_income_weekly > cumberland_council_tax_reduction_applicable_amount_weekly and cumberland_council_tax_reduction_maximum_amount_weekly > cumberland_council_tax_reduction_excess_income_weekly * cumberland_council_tax_reduction_weekly_taper_rate))'}]
  - name: cumberland_council_tax_reduction_award_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Cumberland Council Tax Reduction Scheme 2026/27 section 59.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-cumberland/manual/council-tax-reduction-scheme-2026-2027/page-75, excerpt: "Where an applicant’s income exceeds their applicable amount, their council tax reduction shall be calculated by deducting their excess income multiplied by the taper from their maximum council tax reduction as defined within section 57 of this scheme"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'if cumberland_council_tax_reduction_award_conditions_met: if cumberland_council_tax_reduction_receives_passported_income_related_benefit: cumberland_council_tax_reduction_maximum_amount_weekly else: max(0, cumberland_council_tax_reduction_maximum_amount_weekly - cumberland_council_tax_reduction_excess_income_weekly * cumberland_council_tax_reduction_weekly_taper_rate) else: 0'}]
inputs:
  - {name: cumberland_council_tax_reduction_non_dependant_band, entity: Household, dtype: Number, period: Week}
  - {name: cumberland_council_tax_reduction_assessed_capital_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: cumberland_council_tax_reduction_assessed_income_weekly, entity: Household, dtype: Money, period: Week, unit: GBP}
  - {name: cumberland_council_tax_reduction_applicable_amount_weekly, entity: Household, dtype: Money, period: Week, unit: GBP}
  - {name: cumberland_council_tax_reduction_liability_weekly, entity: Household, dtype: Money, period: Week, unit: GBP}
  - {name: cumberland_council_tax_reduction_non_dependant_deductions_weekly, entity: Household, dtype: Money, period: Week, unit: GBP}
  - {name: cumberland_council_tax_reduction_applicant_is_working_age, entity: Household, dtype: Boolean, period: Year}
  - {name: cumberland_council_tax_reduction_receives_income_support, entity: Household, dtype: Boolean, period: Year}
  - {name: cumberland_council_tax_reduction_receives_income_based_jobseekers_allowance, entity: Household, dtype: Boolean, period: Year}
  - {name: cumberland_council_tax_reduction_receives_income_related_employment_and_support_allowance, entity: Household, dtype: Boolean, period: Year}
  - {name: cumberland_council_tax_reduction_receives_universal_credit, entity: Household, dtype: Boolean, period: Year}
  - {name: cumberland_council_tax_reduction_applicant_is_liable_for_council_tax, entity: Household, dtype: Boolean, period: Year}
  - {name: cumberland_council_tax_reduction_applicant_resides_in_dwelling, entity: Household, dtype: Boolean, period: Year}
  - {name: cumberland_council_tax_reduction_applicant_is_not_deemed_absent, entity: Household, dtype: Boolean, period: Year}
  - {name: cumberland_council_tax_reduction_applicant_is_not_excluded_from_scheme, entity: Household, dtype: Boolean, period: Year}
  - {name: cumberland_council_tax_reduction_maximum_amount_can_be_calculated, entity: Household, dtype: Boolean, period: Year}
  - {name: cumberland_council_tax_reduction_has_valid_application, entity: Household, dtype: Boolean, period: Year}
