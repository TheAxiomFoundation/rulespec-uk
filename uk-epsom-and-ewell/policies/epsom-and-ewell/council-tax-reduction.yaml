    entity: Household
    dtype: Boolean
    period: Year
  - name: would_claim_council_tax_reduction
    entity: Household
    dtype: Boolean
    period: Year
  - name: epsom_and_ewell_council_tax_reduction_applicant_is_working_age
    entity: Household
    dtype: Boolean
    period: Year
  - name: epsom_and_ewell_council_tax_reduction_assessed_capital_for_year
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
  - name: epsom_and_ewell_council_tax_reduction_assessed_monthly_income
    entity: Household
    dtype: Money
    period: Month
    unit: GBP
  - name: epsom_and_ewell_council_tax_reduction_annual_eligible_liability
    entity: Household
    dtype: Money
    period: Year
