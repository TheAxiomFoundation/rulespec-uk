  # Paragraph 58.2 as printed opens "In the case of a non-dependant aged 18 or over",
  # with no words limiting it to the remunerative-work case in 58.1(a). Read literally,
  # a non-dependant not in remunerative work would pay £10.60 or £13.30 on £279 to
  # £604.99 of weekly income but £5.20 at £605 or more. This rule applies the 58.2
  # income bands only in the remunerative-work branch, where they step down from
  # 58.1(a)'s £15.95, and gives everyone else 58.1(b)'s £5.20. That reading is an
  # open interpretation, not a printed qualifier.
  - name: bournemouth_christchurch_and_poole_council_tax_reduction_non_dependant_band
    kind: derived
    entity: Person
    dtype: Integer
    period: Week
    source: Bournemouth, Christchurch and Poole Council Tax Reduction Scheme 2026/27 paragraph 58
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: parameter_table, source: {corpus_citation_path: uk-bournemouth-christchurch-and-poole/manual/council-tax-reduction-scheme-2026-2027/page-99, excerpt: "(a) less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7; (c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7;", table: {header: Non-dependant weekly deductions, row_key: income bands, column_key: deduction band}}}]}}
    versions: [{effective_from: '2026-04-01', formula: "if bournemouth_christchurch_and_poole_council_tax_reduction_non_dependant_deduction_applies: if bournemouth_christchurch_and_poole_council_tax_reduction_non_dependant_in_remunerative_work: if bournemouth_christchurch_and_poole_council_tax_reduction_non_dependant_normal_gross_weekly_income < bournemouth_christchurch_and_poole_council_tax_reduction_non_dependant_low_income_threshold: 1 else: if bournemouth_christchurch_and_poole_council_tax_reduction_non_dependant_normal_gross_weekly_income < bournemouth_christchurch_and_poole_council_tax_reduction_non_dependant_middle_income_threshold: 2 else: if bournemouth_christchurch_and_poole_council_tax_reduction_non_dependant_normal_gross_weekly_income < bournemouth_christchurch_and_poole_council_tax_reduction_non_dependant_top_income_threshold: 3 else: 4 else: 1 else: 0"}]
