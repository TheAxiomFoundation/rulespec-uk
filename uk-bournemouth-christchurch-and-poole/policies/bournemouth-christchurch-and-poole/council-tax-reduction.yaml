  # Paragraph 1.6(b) admits a person over the qualifying age for state pension credit who,
  # or whose partner, is on income support, income-based JSA, income-related ESA or
  # universal credit. Paragraph 1.7 then says the scheme "shall not apply in relation to
  # any person if he, or if he has a partner, his partner, has attained the qualifying age
  # for state pension credit". The two conflict for that group. The
  # applicant_is_not_pensioner input carries 1.6's population, which matches the scheme's
  # page-7 definition of a "person who is not a pensioner". The conflict is recorded here,
  # not resolved.
  - name: bournemouth_christchurch_and_poole_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Bournemouth, Christchurch and Poole Council Tax Reduction Scheme 2026/27 paragraph 1.6
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: uk-bournemouth-christchurch-and-poole/manual/council-tax-reduction-scheme-2026-2027/page-11, excerpt: "this scheme only applies to a person who; a. has not attained the qualifying age for state pension credit; or b. has attained the qualifying age for state pension credit and he, or if he has a partner, his partner, is a person on income support, on income-based jobseeker’s allowance or an income-related employment and support allowance; or a person with an award of universal credit."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "local_authority_is_bournemouth_christchurch_and_poole and council_tax_reduction_household_in_england and bournemouth_christchurch_and_poole_council_tax_reduction_applicant_is_not_pensioner"}]
