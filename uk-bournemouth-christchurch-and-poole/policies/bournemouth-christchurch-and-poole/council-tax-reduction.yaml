    versions: [{effective_from: '2026-04-01', formula: "0.01"}]
  # Paragraph 59.1 and Class E condition (j) deduct the prescribed daily percentage,
  # 2 6/7 per cent, of the weekly excess of income from the maximum reduction for a day.
  # Over the seven days of a week that is (2 6/7 per cent) x 7 = 20 per cent of the same
  # week's excess, the "20% taper" the scheme prints, so this is the same-period rate
  # applied to a same-period excess. The formula keeps the printed mixed number visible:
  # (2 x 7 + 6) / 7 = 2 6/7, multiplied by 7 days, in per-cent units. It multiplies by the
  # days before dividing by the fraction's denominator so that the engine's decimal
  # arithmetic lands on 0.20 exactly rather than on a rounded 6/7.
  - name: bournemouth_christchurch_and_poole_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: Bournemouth, Christchurch and Poole Council Tax Reduction Scheme 2026/27 paragraph 59.1 and Class E condition (j), the prescribed daily percentage of the weekly excess over seven days
    metadata:
      proof:
        atoms:
          - path: 'versions[0].formula'
            kind: formula
            source:
              corpus_citation_path: uk-bournemouth-christchurch-and-poole/manual/council-tax-reduction-scheme-2026-2027/page-101
              excerpt: "59.1 The prescribed daily percentage for the purpose of calculating support as a percentage of excess of income over the applicable amount, which is deducted from maximum council tax reduction, shall be 2 6/7 per cent (a 20% taper)."
          - path: 'versions[0].formula'
            kind: formula
            source:
              corpus_citation_path: uk-bournemouth-christchurch-and-poole/manual/council-tax-reduction-scheme-2026-2027/page-13
              excerpt: "amount A is the maximum council tax reduction in respect of the day in the applicant’s case; and\n\n(ii) amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount (a 20% taper)."
    versions: [{effective_from: '2026-04-01', formula: "(bournemouth_christchurch_and_poole_council_tax_reduction_taper_whole_percentage_points * bournemouth_christchurch_and_poole_council_tax_reduction_taper_fraction_denominator + bournemouth_christchurch_and_poole_council_tax_reduction_taper_fraction_numerator) * bournemouth_christchurch_and_poole_council_tax_reduction_days_per_week / bournemouth_christchurch_and_poole_council_tax_reduction_taper_fraction_denominator * bournemouth_christchurch_and_poole_council_tax_reduction_per_cent_unit"}]
