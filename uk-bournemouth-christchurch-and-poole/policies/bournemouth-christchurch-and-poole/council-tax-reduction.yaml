    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-bournemouth-christchurch-and-poole/manual/council-tax-reduction-scheme-2026-2027/page-98, excerpt: "shall be 80 per cent, of the amount A divided by B"}}]}}
