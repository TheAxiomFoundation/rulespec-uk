    versions: [{effective_from: '2026-04-01', formula: "if bournemouth_christchurch_and_poole_council_tax_reduction_assessed_capital_for_year > bournemouth_christchurch_and_poole_council_tax_reduction_tariff_income_threshold: ceil((bournemouth_christchurch_and_poole_council_tax_reduction_assessed_capital_for_year - bournemouth_christchurch_and_poole_council_tax_reduction_tariff_income_threshold) / bournemouth_christchurch_and_poole_council_tax_reduction_tariff_income_step) * bournemouth_christchurch_and_poole_council_tax_reduction_tariff_income_weekly_amount_per_step * bournemouth_christchurch_and_poole_council_tax_reduction_weeks_per_year else: bournemouth_christchurch_and_poole_council_tax_reduction_capital_limit - bournemouth_christchurch_and_poole_council_tax_reduction_capital_limit"}]
