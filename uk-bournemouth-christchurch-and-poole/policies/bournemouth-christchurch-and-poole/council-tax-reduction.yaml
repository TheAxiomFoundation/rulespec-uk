  # Paragraph 57A.1 prints the minimum as 50p, which is half of one pound. The value is
  # written as that half (1 / 2 = 0.50 GBP) and depends on no other parameter. A bare
  # 0.50 literal cannot be grounded against this excerpt, because the pinned grounding
  # extractor reads no number from "50p" (it parses "50 pence", not "50p"). The pinned
  # encoder's own guidance prefers a plain pence decimal over arithmetic, so this form
  # is a workaround: 1 and 2 pass grounding as small allowed integers, and nothing
  # matches 0.50 to the excerpt automatically. Review it by reading 57A.1. Switch to
  # 0.50 once the extractor reads "50p" as pence.
  - name: bournemouth_christchurch_and_poole_council_tax_reduction_minimum_award_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Bournemouth, Christchurch and Poole Council Tax Reduction Scheme 2026/27 paragraph 57A.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-bournemouth-christchurch-and-poole/manual/council-tax-reduction-scheme-2026-2027/page-99, excerpt: "57A.1 Where an amount of Council Tax Reduction is calculated and it is less than 50p per week, no amount whatsoever will be granted by the authority."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "1 / 2"}]
  - name: bournemouth_christchurch_and_poole_council_tax_reduction_non_dependant_weekly_deduction_by_band
