              excerpt: "58.6 No deduction shall be made in respect of any non-dependants occupying an applicant’s dwelling if the applicant or his partner is–"
              table: {header: Non-dependant weekly deductions, row_key: band 0 (no deduction under 58.6 to 58.8), column_key: weekly deduction}
    versions: [{effective_from: '2026-04-01', values: {0: 0, 1: 5.20, 2: 10.60, 3: 13.30, 4: 15.95}}]
