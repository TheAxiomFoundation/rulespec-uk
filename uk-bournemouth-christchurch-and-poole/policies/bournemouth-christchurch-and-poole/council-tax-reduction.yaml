format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-bournemouth-christchurch-and-poole/manual/council-tax-reduction-scheme-2026-2027/page-101
    # upstream_source_check:
      # status: delegated_scheme
      # checked_paths:
        # - uk/statutes/ukpga/1992/14/13A
        # - uk/regulations/uksi/2012/2885
        # - uk/regulations/uksi/2012/2886
      # rationale: Section 13A delegates the working-age scheme to Bournemouth, Christchurch and Poole Council, so its adopted scheme document is the operative legal source for the locally set working-age values.
  summary: |-
    Bournemouth, Christchurch and Poole's 2026-27 working-age award surface: an 80 percent maximum (100 percent for the specified protected claimant or partner cases), Band C liability ceiling, capital cliff and tariff income, non-dependant deductions, 20 percent excess-income taper, and 50p weekly minimum award.
  deferred_outputs:
    - output: uk-bournemouth-christchurch-and-poole:policies/bournemouth-christchurch-and-poole/council-tax-reduction/section-12#applicable_amount
      reason: Category-specific applicable amounts and premium schedules are not part of this award-surface module.
    - output: uk-bournemouth-christchurch-and-poole:policies/bournemouth-christchurch-and-poole/council-tax-reduction/sections-15-to-56#assessed_income_and_capital
      reason: Income and capital attribution, valuation and disregard schedules are consumed as assessed inputs.
    - output: uk-bournemouth-christchurch-and-poole:policies/bournemouth-christchurch-and-poole/council-tax-reduction/section-58#non_dependant_exemption_and_aggregation
      reason: The individual printed deduction bands are encoded; exemption, couple and household aggregation classifiers remain future outputs.
