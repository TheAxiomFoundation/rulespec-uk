format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-wakefield/manual/council-tax-support-scheme-working-age/block-45
    source_sha256: d848fbb092d161b8694b20cbd02b40dbcfbc6dfc88301d9d25323e49ba6ce316
  summary: “Paragraphs 2 to 7 apply to an application made under this scheme.” An
    application may be made in writing, electronically in accordance with Part 9,
    or by telephone where the authority has published a telephone number. Written
    applications require the designated office and a properly completed form; defective
    written, electronic, and telephone applications have the stated correction routes.
    Telephone validity may require approval of the authority's written statement.
