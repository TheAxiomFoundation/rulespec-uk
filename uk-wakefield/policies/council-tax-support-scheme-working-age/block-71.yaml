format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-wakefield/manual/council-tax-support-scheme-working-age/block-71
    source_sha256: 975f78d66d9c18a62381c31b2166a945b6fe1b0912341baa50e0bec5964cfb50
  summary: Delivery resulting from an electronic communication is presumed where delivery
    to, or by, the relevant council is recorded on an official computer system; it
    is presumed not to have resulted where delivered information to the council is
    not so recorded. Receipt time and date are presumed to be those recorded on an
    official computer system.
