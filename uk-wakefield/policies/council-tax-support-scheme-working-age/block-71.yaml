  entity: LegalProceeding
  dtype: Boolean
  period: Day
- name: information_delivered_to_relevant_council_is_not_recorded_on_official_computer_system
  entity: LegalProceeding
  dtype: Boolean
  period: Day
- name: necessary_to_prove_when_electronically_sent_information_was_received
  entity: LegalProceeding
  dtype: Boolean
  period: Day
- name: receipt_time_and_date_are_recorded_on_official_computer_system
  entity: LegalProceeding
