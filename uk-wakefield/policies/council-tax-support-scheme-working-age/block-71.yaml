  period: Day
rules:
- name: electronic_communication_delivery_is_presumed
  kind: derived
  entity: LegalProceeding
  dtype: Judgment
  period: Day
  source: block-71, first and second paragraphs
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: formula
        source:
          corpus_citation_path: uk-wakefield/manual/council-tax-support-scheme-working-age/block-71
          excerpt: this is presumed to have been the case where
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: uk-wakefield/manual/council-tax-support-scheme-working-age/block-71
          excerpt: any such information has been delivered to the relevant council,
            if the delivery of that information has been recorded on an official computer
            system; or
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: uk-wakefield/manual/council-tax-support-scheme-working-age/block-71
          excerpt: any such information has been delivered by the relevant council,
            if the delivery of that information has been recorded on an official computer
            system.
      - path: versions[0].formula
        kind: exception
        source:
          corpus_citation_path: uk-wakefield/manual/council-tax-support-scheme-working-age/block-71
          excerpt: presumed not to be the case if that information delivered to the
            relevant council has not been recorded
  versions:
  - effective_from: '0001-01-01'
    formula: "necessary_to_prove_electronic_communication_resulted_in_delivery\nand\
      \ not information_delivered_to_relevant_council_is_not_recorded_on_official_computer_system\n\
      and (\n  information_delivered_to_relevant_council_is_recorded_on_official_computer_system\n\
      \  or information_delivered_by_relevant_council_is_recorded_on_official_computer_system\n\
      )"
- name: recorded_receipt_time_and_date_are_presumed
  kind: derived
  entity: LegalProceeding
