format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-wakefield/manual/council-tax-support-scheme-working-age/block-8
    source_sha256: c53b45d0baa6c60c818d5a9feb7199f8f39cc74dedad96724c0cfe35b0b52710
  summary: A person who holds capital in excess of £6000, as assessed in accordance
    with Part 3, is not entitled to Council Tax Support.
inputs:
- name: capital_assessed_in_accordance_with_part_3
  entity: Person
  dtype: Money
  period: Month
  unit: GBP
- name: capital
  entity: Person
  dtype: Money
  period: Month
  unit: GBP
rules:
- name: capital_limit
  kind: parameter
  dtype: Money
  period: Month
  unit: GBP
  source: Wakefield Council Tax Support Scheme (Working Age), block 8
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: amount
        source:
          corpus_citation_path: uk-wakefield/manual/council-tax-support-scheme-working-age/block-8
          excerpt: capital in excess of £6000
  versions:
  - effective_from: '0001-01-01'
    formula: '6000'
- name: not_entitled_to_council_tax_support_due_to_excess_capital
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: Wakefield Council Tax Support Scheme (Working Age), block 8
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: uk-wakefield/manual/council-tax-support-scheme-working-age/block-8
          excerpt: holds capital in excess of £6000
  versions:
  - effective_from: '0001-01-01'
    formula: capital_assessed_in_accordance_with_part_3 > capital_limit
- name: entitled_to_council_tax_support
  kind: derived
  entity: Person
  dtype: Judgment
  period: Month
  source: Wakefield Council Tax Support Scheme (Working Age), block 8
  metadata:
    proof:
      atoms:
      - path: versions[0].formula
        kind: condition
        source:
          corpus_citation_path: uk-wakefield/manual/council-tax-support-scheme-working-age/block-8
          excerpt: capital in excess of £6000
  versions:
  - effective_from: '0001-01-01'
    formula: not (capital > capital_limit)
