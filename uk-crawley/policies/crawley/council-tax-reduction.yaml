format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-51
  summary: |-
    Crawley Council Tax Reduction working-age alignment surface for the 2026-2027 scheme: it applies the local maximum-liability award, working-age UC applicable-amount treatment, capital limit and tariff income, 20 percent excess-income taper, and working-age non-dependant deductions used by PolicyEngine UK's Kingston CTR implementation.
  deferred_outputs:
    - output: uk-crawley:policies/kingston-upon-thames/council-tax-reduction/e#applicable_premiums_amount
      reason: Page 38(e) adds premiums determined under Parts 3 and 4 of the applicable-amount Schedule. This module does not encode those category-specific premium eligibility and amount schedules, so the premium component is deferred rather than treated as zero or inferred from an unrelated amount.
rules:
  - name: crawley_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Crawley Council Tax Reduction Scheme 2026-2027 paragraph 29
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-66
              excerpt: "100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: crawley_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Crawley Council Tax Reduction Scheme 2026-2027 tariff-income upper capital bound
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-51
              excerpt: "reduction in the capital limit to £9000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          9000

