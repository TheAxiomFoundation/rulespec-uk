module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-66
  summary: |-
    Crawley Borough Council's adopted 2026/27 working-age council tax reduction scheme, Classes D and E. Section 57.1 sets the daily maximum at 100 per cent of the daily council tax liability, less the section 58 non-dependant deductions. For Class E, section 59.1 and Class E condition k deduct 2 6/7 per cent of the weekly excess of income over the applicable amount from that daily maximum, so the seven daily deductions in a reduction week withdraw 20 per cent of the weekly excess; this module applies that same-period 20 percent rate to annual excess income against the annual maximum. Capital above £9,000 excludes support (section 33.1). Section 17.1(b) adds the weekly tariff income calculated in line with Housing Benefit Regulations 2006 regulation 52, which Crawley's scheme incorporates without printing its own figures, so the regulation 52 thresholds, upper limit, band size and weekly amount are imported: £1 a week for each £250 or part of £250 of capital above £6,000, or above £10,000 in the regulation 52(4) circumstances, up to £16,000. For Universal Credit cases section 15A.1 substitutes the Secretary of State's income calculation, whose section 15A.2 adjustments include no tariff addition. Support below £5.00 x 1/7 a day, £5.00 a week, is not paid (section 57A.1). Section 58.2 prints its £10.00, £15.00 and £20.00 deductions without the x 1/7 of section 58.1; they are read as weekly amounts, because 58.2(d)'s £20.00 must equal 58.1(a)'s £20.00 x 1/7 a day. Annual figures use a 52-week year (weekly amounts x 52, the section 23.1 divisor) and treat the annual liability input as 52 weekly maxima; section 57.1 divides by the 365 days of 2026/27, so this frame overstates the weekly maximum by 1/364. The liability input is amount A after discounts, the section 57.2 reductions and the section 57.3 joint-liability division, which excludes students under section 45.2 and does not apply under section 57.4 where the only other liable person is the applicant's partner. Income exactly equal to the applicable amount falls literally within neither Class D (less than) nor Class E (more than); it is treated as no excess income and a full award, consistent with section 59.1's "exceeds". The pensioner input is the scheme's defined pensioner (pages 5 and 6), which excludes a person over the qualifying age who, or whose partner, is on income support, income-based jobseeker's allowance, income-related employment and support allowance or universal credit; the Universal Credit input excludes an award disregarded under section 5.3. No council-tax-band cap or reduced maximum percentage is printed. Pension-age provisions are outside this module.
  deferred_outputs:
    - output: uk-crawley:policies/crawley/council-tax-reduction/section-12-and-schedule-1#applicable_amount
      reason: Section 12.1 and Schedule 1 build the legacy weekly applicable amount from personal allowances, family premium, premiums, the work-related activity or support component, and any transitional addition. This award-surface module consumes that applicable amount as an input rather than encoding the premium eligibility and amount schedules.
    - output: uk-crawley:policies/crawley/council-tax-reduction/section-17-and-regulation-52#tariff_income_prescribed_circumstances
      reason: The regulation 52(4) prescribed-circumstances classifier (residential accommodation and the 3 October 2005 transitional cases) is consumed as an input. Its £10,000 threshold is above Crawley's £9,000 capital limit, so for an eligible claimant it can only remove tariff income.
    - output: uk-crawley:policies/crawley/council-tax-reduction/section-58#household_non_dependant_deductions
      reason: This module encodes the per-person section 58.1 and 58.2 deduction amounts; its per-person exemption input covers sections 58.6 to 58.8, including section 58.8's carve-out keeping the deduction for a student under paragraph 4 of Schedule 1 to the 1992 Act. The household total after the section 58.3 couple rule, section 58.5 apportionment and the section 58.6 applicant protections is consumed as an input.
    - output: uk-crawley:policies/crawley/council-tax-reduction/section-33-footnote-16#transitional_capital_limit_protection
      reason: Footnote 16 to section 33.1 limits to 8.5 per cent the reduction in support for an applicant who received maximum council tax benefit at 100 per cent on 31 March 2013 and is affected by the reduction in the capital limit to £9,000. The footnote does not state the base the 8.5 per cent applies to, and this module does not encode that closed transitional cohort.
    - output: uk-crawley:policies/crawley/council-tax-reduction/section-1.7#class_d_or_e_general_conditions
      reason: This module applies the working-age population, application, capital and income conditions of Classes D and E. Their liability, residence, absence, persons-from-abroad (section 7) and student (section 45) conditions are not encoded here.
    - output: uk-crawley:policies/crawley/council-tax-reduction/sections-60-and-61#extended_reduction
      reason: The section 60 and 61 extended reductions, which continue support for up to six weeks after a qualifying benefit ends on starting or increasing work, are not encoded; this module computes the award under the general conditions of entitlement.
