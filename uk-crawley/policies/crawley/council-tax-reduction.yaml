  - name: crawley_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Crawley Council Tax Reduction Scheme 2026-2027 working-age class D and E eligibility surface
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-20
              excerpt: "policy for working age applicants"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_crawley and council_tax_reduction_household_in_england and not council_tax_reduction_household_has_pensioner

  - name: crawley_council_tax_reduction_has_universal_credit_award
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Crawley Council Tax Reduction Scheme 2026-2027 UC applicable-amount condition
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-30
              excerpt: "who has, or"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          crawley_council_tax_reduction_universal_credit_for_year > 0

  - name: crawley_council_tax_reduction_applicable_amount_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Crawley Council Tax Reduction Scheme 2026-2027 applicable amount for working-age UC cases
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-30
              excerpt: "the authority must use the calculation or estimate of the maximum amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if crawley_council_tax_reduction_has_universal_credit_award: crawley_council_tax_reduction_uc_maximum_amount_for_year else: crawley_council_tax_reduction_legacy_applicable_amount_for_year

  - name: crawley_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Crawley Council Tax Reduction Scheme 2026-2027 working-age capital upper bound
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-51
              excerpt: "£9,00016"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          crawley_council_tax_reduction_assessed_capital_for_year <= crawley_council_tax_reduction_capital_limit

  - name: crawley_council_tax_reduction_tariff_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Crawley Council Tax Reduction Scheme 2026-2027 paragraph 72 working-age tariff income
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-66
              excerpt: "£5.00 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if crawley_council_tax_reduction_has_universal_credit_award: 0 else: crawley_council_tax_reduction_tariff_income_weekly_amount_per_step * ceil(max(0, crawley_council_tax_reduction_assessed_capital_for_year - crawley_council_tax_reduction_tariff_income_threshold) / crawley_council_tax_reduction_tariff_income_step) * crawley_council_tax_reduction_weeks_per_year

  - name: crawley_council_tax_reduction_applicable_income_with_tariff_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Crawley Council Tax Reduction Scheme 2026-2027 income calculation including capital tariff
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-34
              excerpt: "by adding to that amount, the weekly income calculated in line with regulation 52 of the Housing Benefit Regulations 2006 (calculation to tariff income from capital)"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          crawley_council_tax_reduction_applicable_income_for_year + crawley_council_tax_reduction_tariff_income_for_year

  - name: crawley_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Crawley Council Tax Reduction Scheme 2026-2027 class E excess-income amount B
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-68
              excerpt: "income exceeds their applicable amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if crawley_council_tax_reduction_relevant_income_based_benefit: 0 else: max(0, crawley_council_tax_reduction_applicable_income_with_tariff_for_year - crawley_council_tax_reduction_applicable_amount_for_year)

  - name: crawley_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Crawley Council Tax Reduction Scheme 2026-2027 class E amount B
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-6
              excerpt: "2 6/7 per cent"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-68
              excerpt: "deducting their excess income multiplied by the taper"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          crawley_council_tax_reduction_excess_income_for_year * crawley_council_tax_reduction_withdrawal_rate

  - name: crawley_council_tax_reduction_non_dependant_in_remunerative_work
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Crawley Council Tax Reduction Scheme 2026-2027 remunerative-work definition
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-20
              excerpt: "not less than 16 hours a week"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          crawley_council_tax_reduction_non_dependant_weekly_hours >= crawley_council_tax_reduction_remunerative_work_hours

  - name: crawley_council_tax_reduction_individual_non_dependant_deduction_for_year
    kind: derived
    entity: Person
    dtype: Money
    period: Year
    unit: GBP
    source: Crawley Council Tax Reduction Scheme 2026-2027 paragraph 30A working-age non-dependant deductions
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-66
              excerpt: "Subject to the following provisions of this paragraph, the non-dependant deductions"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-66
              excerpt: "normal gross weekly income"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-67
              excerpt: "No deduction shall be made in respect of any non-dependants"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if not crawley_council_tax_reduction_is_non_dependant or crawley_council_tax_reduction_non_dependant_exempt: 0 else: (if crawley_council_tax_reduction_non_dependant_in_remunerative_work and crawley_council_tax_reduction_non_dependant_normal_gross_weekly_income >= crawley_council_tax_reduction_non_dependant_top_income_threshold_weekly: crawley_council_tax_reduction_top_non_dependant_deduction_weekly else: (if crawley_council_tax_reduction_non_dependant_in_remunerative_work and crawley_council_tax_reduction_non_dependant_normal_gross_weekly_income >= crawley_council_tax_reduction_non_dependant_high_income_threshold_weekly: crawley_council_tax_reduction_high_non_dependant_deduction_weekly else: (if crawley_council_tax_reduction_non_dependant_in_remunerative_work and crawley_council_tax_reduction_non_dependant_normal_gross_weekly_income >= crawley_council_tax_reduction_non_dependant_mid_income_threshold_weekly: crawley_council_tax_reduction_mid_non_dependant_deduction_weekly else: crawley_council_tax_reduction_low_non_dependant_deduction_weekly))) * crawley_council_tax_reduction_weeks_per_year

  - name: simulated_crawley_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Crawley Council Tax Reduction Scheme 2026-2027 working-age classes D and E amount calculation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-66
              excerpt: "less any deductions in respect of non-dependants which fall to be made under section 58"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-68
              excerpt: "deducting their excess income multiplied by the taper"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-6
              excerpt: "who has made an application"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if crawley_council_tax_reduction_working_age_scheme_applies and would_claim_council_tax_reduction and crawley_council_tax_reduction_capital_eligible: max(0, crawley_council_tax_reduction_maximum_eligible_liability_for_year * crawley_council_tax_reduction_maximum_support_rate - crawley_council_tax_reduction_income_taper_deduction_for_year - crawley_council_tax_reduction_non_dependant_deductions_for_year) else: 0

  - name: crawley_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Crawley Council Tax Reduction Scheme 2026-2027 final working-age local award surface
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-66
              excerpt: "amount of a person’s maximum council tax support"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          simulated_crawley_council_tax_reduction_annual_amount
