  - name: crawley_council_tax_reduction_withdrawal_rate
    kind: parameter
    dtype: Rate
    source: Crawley Council Tax Reduction Scheme 2026-2027 class E excess-income percentage
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-crawley/manual/council-tax-reduction-scheme-2026-2027/page-68
              excerpt: "2 6/7 per cent"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (crawley_council_tax_reduction_taper_whole_percentage_points + crawley_council_tax_reduction_taper_fraction_numerator / crawley_council_tax_reduction_days_per_week) * crawley_council_tax_reduction_per_cent_unit

