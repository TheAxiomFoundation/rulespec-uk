format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-43
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to North West Leicestershire District Council, so the adopted document is the operative legal source for locally set working-age values.
  summary: Working-age Classes D and E use the adopted scheme's 100-percent maximum, capital cliff, tariff income, non-dependant deductions and 2 6/7 percent excess-income deduction. Pension-age and detailed applicable-amount schedules are outside scope.
  deferred_outputs:
    - output: uk-north-west-leicestershire:policies/north-west-leicestershire/council-tax-reduction/paragraph-32-8#homes_for_ukraine_disregard
      reason: The Homes for Ukraine payment disregard is outside this award-surface module.
    - output: uk-north-west-leicestershire:policies/north-west-leicestershire/council-tax-reduction/paragraph-32-8-a#homes_for_ukraine_entitlement_disregard
      reason: The Homes for Ukraine entitlement disregard is outside this award-surface module.
    - output: uk-north-west-leicestershire:policies/north-west-leicestershire/council-tax-reduction/paragraph-32#homes_for_ukraine_disregard
      reason: The Homes for Ukraine payment disregard in paragraph 32 is outside this award-surface module.
    - output: uk-north-west-leicestershire:policies/north-west-leicestershire/council-tax-reduction/paragraph-32-8-1-a#homes_for_ukraine_entitlement_disregard
      reason: Homes for Ukraine special-payment disregard is outside this award-surface module.
    - output: uk-north-west-leicestershire:policies/north-west-leicestershire/council-tax-reduction/a#energy_rebate_and_homes_for_ukraine_disregards
      reason: The Energy Rebate and Homes for Ukraine disregards in page 43(a) are outside the local award calculation inputs encoded here.
    - output: uk-north-west-leicestershire:policies/north-west-leicestershire/council-tax-reduction/part-6#applicable_amount
      reason: Applicable-amount allowances, premiums and components are consumed as an assessed input.
    - output: uk-north-west-leicestershire:policies/north-west-leicestershire/council-tax-reduction/part-10#assessed_income_and_capital
      reason: Income and capital assessment and disregards are outside this award-surface module.
    - output: uk-north-west-leicestershire:policies/north-west-leicestershire/council-tax-reduction/paragraph-30#non_dependant_exemptions_and_aggregation
      reason: This module encodes the printed individual bands; exemptions, couple coordination and household aggregation remain future outputs.
rules:
  - name: north_west_leicestershire_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 29(1A)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-36, excerpt: "100 per cent of the amount A/B"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '1'}]
  - name: north_west_leicestershire_council_tax_reduction_taper_whole_percentage_points
    kind: parameter
    dtype: Number
    period: Year
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 17(f)(ii)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-20, excerpt: "Amount B is 2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '2'}]
  - name: north_west_leicestershire_council_tax_reduction_taper_fraction_numerator
    kind: parameter
    dtype: Number
    period: Year
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 17(f)(ii)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-20, excerpt: "Amount B is 2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '6'}]
  - name: north_west_leicestershire_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    period: Year
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 30(1)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-37, excerpt: "£15.95 x 1/7"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '7'}]
  - name: north_west_leicestershire_council_tax_reduction_per_cent_unit
    kind: parameter
    dtype: Rate
    period: Year
    source: North West Leicestershire Council Tax Reduction Scheme 2026 percentage notation
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-36, excerpt: "100 per cent of the amount A/B"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '0.01'}]
  - name: north_west_leicestershire_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 17(f)(ii), derived from the printed mixed percentage
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-20, excerpt: "Amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '(north_west_leicestershire_council_tax_reduction_taper_whole_percentage_points + north_west_leicestershire_council_tax_reduction_taper_fraction_numerator / north_west_leicestershire_council_tax_reduction_days_per_week) * north_west_leicestershire_council_tax_reduction_per_cent_unit'}]
  - name: north_west_leicestershire_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 23(1)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-33, excerpt: "capital exceeds £16,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '16000'}]
  - name: north_west_leicestershire_council_tax_reduction_tariff_income_threshold
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 72
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-94, excerpt: "£1 for each £250 in excess of £6,000 but not exceeding £16,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '6000'}]
  - name: north_west_leicestershire_council_tax_reduction_tariff_income_step
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 72
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-94, excerpt: "£1 for each £250 in excess of £6,000 but not exceeding £16,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '250'}]
  - name: north_west_leicestershire_council_tax_reduction_tariff_income_weekly_amount_per_step
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 72
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-94, excerpt: "£1 for each £250 in excess of £6,000 but not exceeding £16,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '1'}]
  - name: north_west_leicestershire_council_tax_reduction_weeks_per_year
    kind: parameter
    dtype: Number
    period: Year
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 25(3)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-36, excerpt: "divide the product by 52"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '52'}]
  - name: north_west_leicestershire_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: north_west_leicestershire_council_tax_reduction_non_dependant_deduction_band
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 30(1)-(2)
    metadata: {proof: {atoms: [{path: "versions[0].values", kind: parameter_table, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-37, excerpt: "(a) In respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) In respect of a non-dependant aged 18 or over to whom paragraph (a) does not apply, £5.20 x 1/7\n\n(2) In the case of a non-dependant aged 18 or over to whom sub-paragraph (1) (a) applies, where it is shown to the appropriate authority that his normal gross weekly income is: (a) Less than £279.00, the deduction to be made under this paragraph is that specified in sub-paragraph (1) (b); (b) Not less than £279.00 but less than £485.00, the deduction to be made under this paragraph is £10.60 x 1/7; (c) Not less than £485.00 but less than £605.00, the deduction to be made under this paragraph is £13.30 x 1/7"}}]}}
    versions: [{effective_from: '2026-04-01', values: {0: 0, 1: 5.2, 2: 10.6, 3: 13.3, 4: 15.95}}]
  - name: north_west_leicestershire_council_tax_reduction_tariff_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 72
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-94, excerpt: "£1 for each £250 in excess of £6,000 but not exceeding £16,000; (b) £1 for any excess which is not a complete £250"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'if north_west_leicestershire_council_tax_reduction_assessed_capital_for_year > north_west_leicestershire_council_tax_reduction_tariff_income_threshold: ceil((north_west_leicestershire_council_tax_reduction_assessed_capital_for_year - north_west_leicestershire_council_tax_reduction_tariff_income_threshold) / north_west_leicestershire_council_tax_reduction_tariff_income_step) * north_west_leicestershire_council_tax_reduction_tariff_income_weekly_amount_per_step * north_west_leicestershire_council_tax_reduction_weeks_per_year else: north_west_leicestershire_council_tax_reduction_capital_limit - north_west_leicestershire_council_tax_reduction_capital_limit'}]
  - name: north_west_leicestershire_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 23(1)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-33, excerpt: "capital exceeds £16,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'north_west_leicestershire_council_tax_reduction_assessed_capital_for_year <= north_west_leicestershire_council_tax_reduction_capital_limit'}]
  - name: north_west_leicestershire_council_tax_reduction_class_d_income_condition
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 16(e)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-20, excerpt: "Whose income (if any) for the relevant week is less than his applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'north_west_leicestershire_council_tax_reduction_assessed_income_for_year + north_west_leicestershire_council_tax_reduction_tariff_income_for_year < north_west_leicestershire_council_tax_reduction_applicable_amount_for_year'}]
  - name: north_west_leicestershire_council_tax_reduction_class_e_income_condition
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 17(e)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-20, excerpt: "Whose income for the relevant week is greater than his applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'north_west_leicestershire_council_tax_reduction_assessed_income_for_year + north_west_leicestershire_council_tax_reduction_tariff_income_for_year > north_west_leicestershire_council_tax_reduction_applicable_amount_for_year'}]
  - name: north_west_leicestershire_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 17(f)(ii)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-20, excerpt: "difference between his income for the relevant week and his applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'max(north_west_leicestershire_council_tax_reduction_assessed_income_for_year + north_west_leicestershire_council_tax_reduction_tariff_income_for_year - north_west_leicestershire_council_tax_reduction_applicable_amount_for_year, north_west_leicestershire_council_tax_reduction_capital_limit - north_west_leicestershire_council_tax_reduction_capital_limit)'}]
  - name: north_west_leicestershire_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 17(f)(ii)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-20, excerpt: "Amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'north_west_leicestershire_council_tax_reduction_excess_income_for_year * north_west_leicestershire_council_tax_reduction_weekly_taper_rate'}]
  - name: north_west_leicestershire_council_tax_reduction_maximum_amount_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: North West Leicestershire Council Tax Reduction Scheme 2026 paragraph 29(1)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-36, excerpt: "a person's maximum council tax reduction amount in respect of a day is 100 per cent of the amount A/B"}}, {path: "versions[0].formula", kind: ordering, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-36, excerpt: "less any deductions in respect of non-dependants which fall to be made under paragraph 30"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'max(north_west_leicestershire_council_tax_reduction_eligible_liability_for_year * north_west_leicestershire_council_tax_reduction_maximum_support_rate - north_west_leicestershire_council_tax_reduction_non_dependant_deductions_for_year, north_west_leicestershire_council_tax_reduction_capital_limit - north_west_leicestershire_council_tax_reduction_capital_limit)'}]
  - name: north_west_leicestershire_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: North West Leicestershire Council Tax Reduction Scheme 2026 Classes D and E
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-20, excerpt: "persons who are not pensioners"}}, {path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-20, excerpt: "amount A exceeds amount B"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'local_authority_is_north_west_leicestershire and north_west_leicestershire_council_tax_reduction_applicant_is_not_pensioner and would_claim_council_tax_reduction and north_west_leicestershire_council_tax_reduction_other_class_conditions_met and north_west_leicestershire_council_tax_reduction_capital_eligible and (north_west_leicestershire_council_tax_reduction_class_d_income_condition or (north_west_leicestershire_council_tax_reduction_class_e_income_condition and north_west_leicestershire_council_tax_reduction_maximum_amount_for_year > north_west_leicestershire_council_tax_reduction_income_taper_deduction_for_year))'}]
  - name: north_west_leicestershire_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-43(a)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-43, excerpt: "Where the person is within class A or D, that amount is the amount which is the maximum council tax reduction in respect of the day in the applicant's case."}}, {path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-north-west-leicestershire/manual/council-tax-reduction-scheme-2026-2027/page-43, excerpt: "Where the person is within class B or E, that amount is the amount found by deducting amount B from amount A"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'if north_west_leicestershire_council_tax_reduction_award_conditions_met: (if north_west_leicestershire_council_tax_reduction_class_d_income_condition: north_west_leicestershire_council_tax_reduction_maximum_amount_for_year else: north_west_leicestershire_council_tax_reduction_maximum_amount_for_year - north_west_leicestershire_council_tax_reduction_income_taper_deduction_for_year) else: north_west_leicestershire_council_tax_reduction_capital_limit - north_west_leicestershire_council_tax_reduction_capital_limit'}]
inputs:
  - {name: local_authority_is_north_west_leicestershire, entity: Household, dtype: Boolean, period: Year}
  - {name: would_claim_council_tax_reduction, entity: Household, dtype: Boolean, period: Year}
  - {name: north_west_leicestershire_council_tax_reduction_applicant_is_not_pensioner, entity: Household, dtype: Boolean, period: Year}
  - {name: north_west_leicestershire_council_tax_reduction_other_class_conditions_met, entity: Household, dtype: Boolean, period: Year}
  - {name: north_west_leicestershire_council_tax_reduction_assessed_capital_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: north_west_leicestershire_council_tax_reduction_eligible_liability_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: north_west_leicestershire_council_tax_reduction_assessed_income_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: north_west_leicestershire_council_tax_reduction_applicable_amount_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: north_west_leicestershire_council_tax_reduction_non_dependant_deductions_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: north_west_leicestershire_council_tax_reduction_non_dependant_deduction_band, entity: Person, dtype: Number, period: Week}
