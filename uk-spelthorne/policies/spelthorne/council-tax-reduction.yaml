        formula: |-
          if spelthorne_council_tax_reduction_has_universal_credit_award: 0 else: spelthorne_council_tax_reduction_tariff_income_weekly_amount_per_step * ceil(max(0, spelthorne_council_tax_reduction_assessed_capital_for_year - spelthorne_council_tax_reduction_tariff_income_threshold) / spelthorne_council_tax_reduction_tariff_income_step) * spelthorne_council_tax_reduction_weeks_per_year

