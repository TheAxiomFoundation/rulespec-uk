      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-spelthorne/manual/council-tax-reduction-scheme-2026-2027/page-50
              excerpt: "is 75 per cent of the amount A/B where -"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.75

