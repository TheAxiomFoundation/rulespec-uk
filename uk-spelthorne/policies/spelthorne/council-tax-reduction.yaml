format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-spelthorne/manual/council-tax-reduction-scheme-2026-2027/page-54
  summary: |-
    Spelthorne's operative 2026-27 working-age scheme applies a 75% maximum reduction, or 90% for Class G additional-financial-assistance applicants. It applies the printed 20% weekly excess-income taper, £16,000 capital cliff, £6,000/£250 tariff-income rule, and non-dependant deductions. The Class E award is explicitly amount A less amount B, so the taper is deducted from the defined maximum.
  deferred_outputs:
    - output: uk-spelthorne:policies/spelthorne/council-tax-reduction/part-11-and-schedule-1#applicable_amount
      reason: Detailed applicable-amount and premium schedules are outside this award-surface module.
    - output: uk-spelthorne:policies/spelthorne/council-tax-reduction/paragraph-48#non_dependant_exemption_and_apportionment
      reason: This module consumes the exemption and household apportionment result while encoding the printed deduction bands.
