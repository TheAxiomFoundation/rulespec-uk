    versions:
      - effective_from: '2026-04-01'
        formula: |-
          7

  - name: east_riding_of_yorkshire_council_tax_reduction_non_dependant_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: east_riding_of_yorkshire_council_tax_reduction_non_dependant_band
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 paragraph 36.5
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-37
              excerpt: "(a) in respect of a non-dependant aged 18 or over in remunerative work, £25 x 1/7 (The deduction will be £25 per reductions week); (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £10.00 x 1/7. (The deduction will be £10 per reductions week)"
              table:
                header: non-dependant deduction
                row_key: non-dependant band
                column_key: weekly deduction
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 0
          1: 25
          2: 10.00

