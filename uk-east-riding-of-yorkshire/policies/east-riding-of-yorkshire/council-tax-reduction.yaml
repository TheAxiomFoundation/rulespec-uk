format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-54
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to East Riding of Yorkshire Council, so the adopted document is operative.
  summary: |-
    East Riding of Yorkshire's operative 2026/27 working-age award is a banded percentage of the defined maximum Council Tax Support. Pension-age prescribed provisions are outside this local working-age module.
  deferred_outputs:
    - output: uk-east-riding-of-yorkshire:policies/east-riding-of-yorkshire/council-tax-reduction/schedule-1#assessed_weekly_income
      reason: The band grid consumes the scheme-defined weekly income after its detailed income and disregard rules.
    - output: uk-east-riding-of-yorkshire:policies/east-riding-of-yorkshire/council-tax-reduction/sections-26-to-34#assessed_capital
      reason: Capital valuation, attribution, and disregard rules are outside this award surface.
rules:
  - name: east_riding_of_yorkshire_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 paragraph 36.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-36
              excerpt: "shall be 80 per cent, of the amount A divided by B where;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.80

  - name: east_riding_of_yorkshire_council_tax_reduction_per_cent_unit
    kind: parameter
    dtype: Rate
    period: Year
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 percentage notation
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-36
              excerpt: "shall be 80 per cent, of the amount A divided by B where;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.01

