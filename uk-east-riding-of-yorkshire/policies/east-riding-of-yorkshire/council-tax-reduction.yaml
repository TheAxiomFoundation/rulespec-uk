    dtype: Money
    period: Year
    unit: GBP
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 Schedule 1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-54
              excerpt: "£255.36 and over £309.33 and over £379.92 and over £450.50 and over"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0

  - name: east_riding_of_yorkshire_council_tax_reduction_capital_limit
