  - name: east_riding_of_yorkshire_council_tax_reduction_family_category_selected
    kind: derived
    entity: Household
    dtype: Number
    period: Year
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 Schedule 1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: parameter_table, source: {corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-54, excerpt: "Table 1"}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if east_riding_of_yorkshire_council_tax_reduction_has_two_or_more_children: east_riding_of_yorkshire_council_tax_reduction_family_category_family_with_two_or_more_children_code else: if east_riding_of_yorkshire_council_tax_reduction_has_one_child: east_riding_of_yorkshire_council_tax_reduction_family_category_family_with_one_child_code else: if east_riding_of_yorkshire_council_tax_reduction_has_partner: east_riding_of_yorkshire_council_tax_reduction_family_category_couple_no_children_code else: east_riding_of_yorkshire_council_tax_reduction_family_category_single_no_children_code

  - name: east_riding_of_yorkshire_council_tax_reduction_selected_income_band
    kind: derived
    entity: Household
    dtype: Number
    period: Week
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 Schedule 1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: parameter_table, source: {corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-54, excerpt: "Table 1"}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if east_riding_of_yorkshire_council_tax_reduction_passported: east_riding_of_yorkshire_council_tax_reduction_passported_80_code else: if east_riding_of_yorkshire_council_tax_reduction_assessed_weekly_income >= east_riding_of_yorkshire_council_tax_reduction_band_5_lower_income_by_family[east_riding_of_yorkshire_council_tax_reduction_family_category_selected]: east_riding_of_yorkshire_council_tax_reduction_non_passported_0_code else: if east_riding_of_yorkshire_council_tax_reduction_assessed_weekly_income >= east_riding_of_yorkshire_council_tax_reduction_band_4_lower_income_by_family[east_riding_of_yorkshire_council_tax_reduction_family_category_selected]: east_riding_of_yorkshire_council_tax_reduction_non_passported_25_code else: if east_riding_of_yorkshire_council_tax_reduction_assessed_weekly_income >= east_riding_of_yorkshire_council_tax_reduction_band_3_lower_income_by_family[east_riding_of_yorkshire_council_tax_reduction_family_category_selected]: east_riding_of_yorkshire_council_tax_reduction_non_passported_50_code else: if east_riding_of_yorkshire_council_tax_reduction_assessed_weekly_income >= east_riding_of_yorkshire_council_tax_reduction_band_2_lower_income_by_family[east_riding_of_yorkshire_council_tax_reduction_family_category_selected]: east_riding_of_yorkshire_council_tax_reduction_non_passported_60_code else: east_riding_of_yorkshire_council_tax_reduction_non_passported_70_code

  - name: east_riding_of_yorkshire_council_tax_reduction_selected_discount_rate
    kind: derived
    entity: Household
    dtype: Rate
    period: Year
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 Schedule 1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: exception, source: {corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-54, excerpt: "discount will be awarded at Band 1 level."}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          east_riding_of_yorkshire_council_tax_reduction_discount_rate_by_band[east_riding_of_yorkshire_council_tax_reduction_selected_income_band]

  - name: east_riding_of_yorkshire_council_tax_reduction_band_b_capped_eligible_liability_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 paragraph 36.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-36, excerpt: "A Is the lower of: i. the amount set by the authority as the council tax for the relevant financial year in respect of the dwelling in which he is a resident and for which he is liable, subject to any discount which may be appropriate to that dwelling under the 1992 Act; and ii. the amount set by the authority as the council tax for the relevant financial year in respect of the dwelling within Band B subject to any discount which may be appropriate to the applicant under the 1992 Act"}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          min(east_riding_of_yorkshire_council_tax_reduction_actual_liability_for_year, east_riding_of_yorkshire_council_tax_reduction_band_b_liability_for_year)

  - name: east_riding_of_yorkshire_council_tax_reduction_daily_non_dependant_deduction
    kind: derived
    entity: Household
    dtype: Money
    period: Day
    unit: GBP
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 paragraph 36.5
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-37, excerpt: "£25 x 1/7 (The deduction will be £25 per reductions week); (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £10.00 x 1/7. (The deduction will be £10 per reductions week)"}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          east_riding_of_yorkshire_council_tax_reduction_non_dependant_deduction_by_band[east_riding_of_yorkshire_council_tax_reduction_non_dependant_band] / east_riding_of_yorkshire_council_tax_reduction_days_per_week

  - name: east_riding_of_yorkshire_council_tax_reduction_annual_non_dependant_deduction
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 paragraph 36.5
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-37, excerpt: "the non-dependant deductions in respect of a day referred to in paragraph 36.1 shall be:"}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          east_riding_of_yorkshire_council_tax_reduction_daily_non_dependant_deduction * east_riding_of_yorkshire_council_tax_reduction_financial_year_days

  - name: east_riding_of_yorkshire_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 Schedule 1 paragraph 5
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-54, excerpt: "Any applicant whose capital is £6,000 or above shall not be entitled to any council tax support whatsoever."}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          east_riding_of_yorkshire_council_tax_reduction_assessed_capital < east_riding_of_yorkshire_council_tax_reduction_capital_limit

  - name: east_riding_of_yorkshire_council_tax_reduction_maximum_amount_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 paragraph 36.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-36, excerpt: "shall be 80 per cent, of the amount A divided by B where;"}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          east_riding_of_yorkshire_council_tax_reduction_band_b_capped_eligible_liability_for_year * east_riding_of_yorkshire_council_tax_reduction_maximum_support_rate

  - name: east_riding_of_yorkshire_council_tax_reduction_amount_before_eligibility
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 Schedule 1 paragraph 2
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-54
              excerpt: "In all cases, the amount of support to be granted is to be based on the following factors: (a) The maximum council tax support as defined within this scheme;"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(east_riding_of_yorkshire_council_tax_reduction_zero_amount, east_riding_of_yorkshire_council_tax_reduction_maximum_amount_for_year * east_riding_of_yorkshire_council_tax_reduction_selected_discount_rate - east_riding_of_yorkshire_council_tax_reduction_annual_non_dependant_deduction)

  - name: east_riding_of_yorkshire_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 working-age award
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-54, excerpt: "Any applicant whose capital is £6,000 or above shall not be entitled to any council tax support whatsoever."}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_east_riding_of_yorkshire and east_riding_of_yorkshire_council_tax_reduction_applicant_is_working_age and would_claim_council_tax_reduction and east_riding_of_yorkshire_council_tax_reduction_capital_eligible

  - name: east_riding_of_yorkshire_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: East Riding of Yorkshire Council Tax Support Scheme 2026/27 Schedule 1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-east-riding-of-yorkshire/manual/council-tax-support-scheme-2026-2027/page-54, excerpt: "The authority’s council tax support scheme from 2026/27 shall be calculated on the basis of"}}]}}
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if east_riding_of_yorkshire_council_tax_reduction_award_conditions_met: east_riding_of_yorkshire_council_tax_reduction_amount_before_eligibility else: east_riding_of_yorkshire_council_tax_reduction_zero_amount
inputs:
  - {name: local_authority_is_east_riding_of_yorkshire, entity: Household, dtype: Boolean, period: Year}
