    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-54, excerpt: "the prescribed amount is £16,000 and no support shall be granted when the applicant has an amount greater that this level."}}]}}
