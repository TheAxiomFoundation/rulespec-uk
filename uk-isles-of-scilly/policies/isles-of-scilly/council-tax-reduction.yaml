    versions: [{effective_from: '2026-04-01', formula: 'isles_of_scilly_council_tax_reduction_working_age_scheme_applies and isles_of_scilly_council_tax_reduction_capital_eligible and would_claim_council_tax_reduction and isles_of_scilly_council_tax_reduction_maximum_for_year > isles_of_scilly_council_tax_reduction_income_taper_deduction_for_year'}]
  - name: isles_of_scilly_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-74, excerpt: "their Council Tax Reduction shall be calculated by deducting their excess income multiplied by the taper from their maximum Council Tax Reduction"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'if isles_of_scilly_council_tax_reduction_award_conditions_met: isles_of_scilly_council_tax_reduction_maximum_for_year - isles_of_scilly_council_tax_reduction_income_taper_deduction_for_year else: isles_of_scilly_council_tax_reduction_capital_limit - isles_of_scilly_council_tax_reduction_capital_limit'}]
