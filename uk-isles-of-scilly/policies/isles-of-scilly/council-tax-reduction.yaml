    period: Year
    unit: GBP
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 42.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-59, excerpt: "each complete £250"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '250'}]
  - name: isles_of_scilly_council_tax_reduction_tariff_income_weekly_amount_per_step
    kind: parameter
