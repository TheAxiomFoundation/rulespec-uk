    versions: [{effective_from: '2026-04-01', formula: '1'}]
  - name: isles_of_scilly_council_tax_reduction_weeks_per_year
    kind: parameter
    dtype: Number
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 annual conversion
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "period of excess of 52 weeks"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '52'}]
  - name: isles_of_scilly_council_tax_reduction_non_dependant_deduction_weekly_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: isles_of_scilly_council_tax_reduction_non_dependant_band
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 58
    metadata:
      proof:
        atoms:
          - path: 'versions[0].values'
            kind: parameter_table
            source:
              corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "58.1 Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 29 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7. 58.2 In the case of a non-dependant aged 18 or over, where it is shown to the appropriate authority that his normal gross weekly income is– (a) less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7; (c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7;"
              table: {header: "58.1–58.2", row_key: income band, column_key: weekly deduction}
    versions: [{effective_from: '2026-04-01', values: {0: 0, 1: 5.20, 2: 10.60, 3: 13.30, 4: 15.95}}]
  - name: isles_of_scilly_council_tax_reduction_non_dependant_income_threshold_low
    kind: parameter
