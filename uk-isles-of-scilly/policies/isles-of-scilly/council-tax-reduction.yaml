    period: Week
    unit: GBP
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 58.2
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-72, excerpt: "not less than £279.00, but less than £485.00"}}]}}
