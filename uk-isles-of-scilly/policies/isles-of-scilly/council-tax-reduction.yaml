    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 33.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-54, excerpt: "no support shall be granted when the applicant has an amount greater that this level."}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'isles_of_scilly_council_tax_reduction_assessed_capital_for_year <= isles_of_scilly_council_tax_reduction_capital_limit'}]
  - name: isles_of_scilly_council_tax_reduction_tariff_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 42
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-59, excerpt: "Where the applicant’s capital calculated in accordance with this scheme exceeds £6,000 it shall be treated as equivalent to a weekly income of £1 for each complete £250 of in excess of £6,000 but not exceeding £16,000."}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'if isles_of_scilly_council_tax_reduction_assessed_capital_for_year > isles_of_scilly_council_tax_reduction_tariff_income_threshold: ceil((isles_of_scilly_council_tax_reduction_assessed_capital_for_year - isles_of_scilly_council_tax_reduction_tariff_income_threshold) / isles_of_scilly_council_tax_reduction_tariff_income_step) * isles_of_scilly_council_tax_reduction_tariff_income_weekly_amount_per_step * isles_of_scilly_council_tax_reduction_weeks_per_year else: isles_of_scilly_council_tax_reduction_capital_limit - isles_of_scilly_council_tax_reduction_capital_limit'}]
  - name: isles_of_scilly_council_tax_reduction_individual_non_dependant_deduction_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 58
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-72, excerpt: "the non-dependant deductions in respect of a day referred to in section 29"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'if isles_of_scilly_council_tax_reduction_non_dependant_deduction_applies: if isles_of_scilly_council_tax_reduction_non_dependant_in_remunerative_work: if isles_of_scilly_council_tax_reduction_non_dependant_normal_gross_weekly_income < isles_of_scilly_council_tax_reduction_non_dependant_income_threshold_low: isles_of_scilly_council_tax_reduction_non_dependant_deduction_weekly_by_band[1] else: if isles_of_scilly_council_tax_reduction_non_dependant_normal_gross_weekly_income < isles_of_scilly_council_tax_reduction_non_dependant_income_threshold_middle: isles_of_scilly_council_tax_reduction_non_dependant_deduction_weekly_by_band[2] else: if isles_of_scilly_council_tax_reduction_non_dependant_normal_gross_weekly_income < isles_of_scilly_council_tax_reduction_non_dependant_income_threshold_top: isles_of_scilly_council_tax_reduction_non_dependant_deduction_weekly_by_band[3] else: isles_of_scilly_council_tax_reduction_non_dependant_deduction_weekly_by_band[4] else: isles_of_scilly_council_tax_reduction_non_dependant_deduction_weekly_by_band[1] else: isles_of_scilly_council_tax_reduction_non_dependant_deduction_weekly_by_band[0]'}]
  - name: isles_of_scilly_council_tax_reduction_maximum_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-72, excerpt: "shall be 100 per cent, of the amount A divided by B where;"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'isles_of_scilly_council_tax_reduction_actual_liability_for_year * isles_of_scilly_council_tax_reduction_maximum_support_rate - isles_of_scilly_council_tax_reduction_non_dependant_deductions_for_year'}]
  - name: isles_of_scilly_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-74, excerpt: "deducting their excess income multiplied by the taper"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'max(isles_of_scilly_council_tax_reduction_assessed_income_for_year + isles_of_scilly_council_tax_reduction_tariff_income_for_year - isles_of_scilly_council_tax_reduction_applicable_amount_for_year, isles_of_scilly_council_tax_reduction_capital_limit - isles_of_scilly_council_tax_reduction_capital_limit)'}]
  - name: isles_of_scilly_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-74, excerpt: "deducting their excess income multiplied by the taper"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'isles_of_scilly_council_tax_reduction_excess_income_for_year * isles_of_scilly_council_tax_reduction_weekly_taper_rate'}]
  - name: isles_of_scilly_council_tax_reduction_award_conditions_met
