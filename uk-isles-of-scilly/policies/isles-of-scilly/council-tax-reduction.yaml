format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-74
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to the Council of the Isles of Scilly, so the adopted scheme document is the operative legal source for the locally set working-age values.
  summary: Isles of Scilly's operative 2026-27 local working-age scheme provides the defined maximum liability amount less non-dependant deductions, then deducts excess income at the printed taper. Pension-age provisions are outside scope.
  deferred_outputs:
    - output: uk-isles-of-scilly:policies/isles-of-scilly/council-tax-reduction/sections-12-to-42-and-schedules-1-to-5#assessed_income_capital_and_applicable_amount
      reason: Detailed applicable-amount, income and capital assessment schedules feed this award surface.
    - output: uk-isles-of-scilly:policies/isles-of-scilly/council-tax-reduction/section-58#non_dependant_exemption_and_household_aggregation
      reason: Resident exemptions, couple coordination and aggregation determine the household deduction input.
    - output: uk-isles-of-scilly:policies/isles-of-scilly/council-tax-reduction/class-f#second_adult_rebate
      reason: Class F second-adult reduction is a separate calculation.
rules:
  - name: isles_of_scilly_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-72, excerpt: "shall be 100 per cent, of the amount A divided by B where;"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '1'}]
  - name: isles_of_scilly_council_tax_reduction_per_cent_unit
    kind: parameter
    dtype: Rate
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 percentage notation
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-72, excerpt: "100 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '0.01'}]
  - name: isles_of_scilly_council_tax_reduction_taper_whole_percentage_points
    kind: parameter
    dtype: Number
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-74, excerpt: "shall be 2 6/7 per cent."}}]}}
    versions: [{effective_from: '2026-04-01', formula: '2'}]
  - name: isles_of_scilly_council_tax_reduction_taper_fraction_numerator
    kind: parameter
    dtype: Number
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-74, excerpt: "shall be 2 6/7 per cent."}}]}}
    versions: [{effective_from: '2026-04-01', formula: '6'}]
  - name: isles_of_scilly_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 58.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-72, excerpt: "£15.95 x 1/7"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '7'}]
  - name: isles_of_scilly_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: Isles of Scilly Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-isles-of-scilly/manual/council-tax-reduction-scheme-2026-2027/page-74, excerpt: "shall be 2 6/7 per cent."}}]}}
    versions: [{effective_from: '2026-04-01', formula: '(isles_of_scilly_council_tax_reduction_taper_whole_percentage_points + isles_of_scilly_council_tax_reduction_taper_fraction_numerator / isles_of_scilly_council_tax_reduction_days_per_week) * isles_of_scilly_council_tax_reduction_per_cent_unit'}]
  - name: isles_of_scilly_council_tax_reduction_capital_limit
    kind: parameter
