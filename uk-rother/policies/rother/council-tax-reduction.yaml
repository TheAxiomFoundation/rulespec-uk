format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-rother/manual/council-tax-reduction-scheme-2026-2027/page-42
  summary: |-
    Rother District Council's 2026-27 working-age discount scheme calculates the
    maximum Council Tax Reduction at 100 per cent of eligible annual council-tax
    liability. Detailed income, capital, household, daily-liability and pension-age
    calculations remain outside this focused maximum-award surface.
  deferred_outputs:
    - output: uk-rother:policies/rother/council-tax-reduction/paragraphs-12-to-38#income_and_capital_assessment
      reason: The scheme's detailed income and capital assessment is outside this maximum-award surface.
    - output: uk-rother:policies/rother/council-tax-reduction/paragraph-39#daily_and_joint_liability_apportionment
      reason: Daily calculation and joint-liability apportionment are outside this annual-liability input surface.
rules:
  - name: rother_council_tax_reduction_per_cent_unit
    kind: parameter
    dtype: Rate
    period: Year
    source: Rother District Council Draft Council Tax Reduction Scheme 2026 paragraph 39.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source: &maximum_support_source
              corpus_citation_path: uk-rother/manual/council-tax-reduction-scheme-2026-2027/page-42
              excerpt: "shall be 100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.01

  - name: rother_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Rother District Council Draft Council Tax Reduction Scheme 2026 paragraph 39.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source: *maximum_support_source
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: rother_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Rother District Council Draft Council Tax Reduction Scheme 2026 paragraph 39.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-rother/manual/council-tax-reduction-scheme-2026-2027/page-42
              excerpt: "A is the amount set by the appropriate authority as the council tax for the relevant financial year in respect of the dwelling in which he is a resident and for which he is liable, subject to any discount which may be appropriate to that dwelling under the 1992 Act"
          - path: versions[0].formula
            kind: formula
            source: *maximum_support_source
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          rother_council_tax_reduction_annual_eligible_liability * rother_council_tax_reduction_maximum_support_rate
inputs:
  - name: rother_council_tax_reduction_annual_eligible_liability
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
