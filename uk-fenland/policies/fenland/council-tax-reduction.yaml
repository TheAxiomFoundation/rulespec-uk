format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-42
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to this authority, so its adopted scheme is the operative source.
  summary: Fenland's adopted 2026-27 Class D/E working-age CTR surface is an 80 percent maximum-liability award after non-dependant deductions and the printed excess-income taper. Class D strictly requires income below the applicable amount and Class E strictly requires income above it; equality is not assigned to either printed class. The separate Class F alternative maximum is expressly excluded from this final output. Pension-age provisions are outside scope.
  deferred_outputs:
    - output: uk-fenland:policies/fenland/council-tax-reduction/schedule-3#applicable_amount
      reason: The working-age applicable-amount schedules determine this calculation input but are not encoded here.
    - output: uk-fenland:policies/fenland/council-tax-reduction/paragraph-18#alternative_maximum_reduction
      reason: The separate Class F alternative maximum calculation and its resident-income classifier are outside this expressly Class-F-excluded Class D/E award surface.
rules:
  - name: fenland_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    source: Fenland Council Tax Reduction Scheme 2026/2027 paragraph 32(4)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-42, excerpt: "80% of the maximum council tax reduction"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '0.80'}]
  - name: fenland_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Fenland Council Tax Reduction Scheme 2026/2027 paragraph 23A
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-32, excerpt: "capital exceeds £10,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '10000'}]
  - name: fenland_council_tax_reduction_taper_whole_percentage_points
    kind: parameter
    dtype: Number
    source: Fenland Council Tax Reduction Scheme 2026/2027 Class E
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-24, excerpt: "2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '2'}]
  - name: fenland_council_tax_reduction_taper_fraction_numerator
    kind: parameter
    dtype: Number
    source: Fenland Council Tax Reduction Scheme 2026/2027 Class E
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-24, excerpt: "2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '6'}]
  - name: fenland_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    source: Fenland Council Tax Reduction Scheme 2026/2027 Class E taper denominator
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-24, excerpt: "2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '7'}]
  - name: fenland_council_tax_reduction_per_cent_unit
    kind: parameter
    dtype: Rate
    source: Fenland Council Tax Reduction Scheme 2026/2027 percentage notation
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-37, excerpt: "100 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '0.01'}]
  - name: fenland_council_tax_reduction_flat_non_dependant_deduction_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Fenland Council Tax Reduction Scheme 2026/2027 paragraph 30(2)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-37, excerpt: "£7.40 per week from 01/04/22"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '7.40'}]
  - name: fenland_council_tax_reduction_tariff_income_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Fenland Council Tax Reduction Scheme 2026/2027 paragraph 72
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-80, excerpt: "72.0 This is no longer used"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '0'}]
  - name: fenland_council_tax_reduction_daily_taper_rate
    kind: parameter
    dtype: Rate
    period: Day
    source: Fenland Council Tax Reduction Scheme 2026/2027 Class E
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-24, excerpt: "2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '(fenland_council_tax_reduction_taper_whole_percentage_points + fenland_council_tax_reduction_taper_fraction_numerator / fenland_council_tax_reduction_days_per_week) * fenland_council_tax_reduction_per_cent_unit'}]
  - name: fenland_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: Fenland Council Tax Reduction Scheme 2026/2027 Class E
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-24, excerpt: "2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'fenland_council_tax_reduction_daily_taper_rate * fenland_council_tax_reduction_days_per_week'}]
  - name: fenland_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Week
    source: Fenland Council Tax Reduction Scheme 2026/2027 paragraph 23A
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-32, excerpt: "capital exceeds £10,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'fenland_council_tax_reduction_assessed_capital_weekly <= fenland_council_tax_reduction_capital_limit'}]
  - name: fenland_council_tax_reduction_excess_income_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Fenland Council Tax Reduction Scheme 2026/2027 Class E
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-24, excerpt: "difference between his income for the relevant week and his applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'max(0, fenland_council_tax_reduction_assessed_income_weekly + fenland_council_tax_reduction_tariff_income_weekly - fenland_council_tax_reduction_applicable_amount_weekly)'}]
  - name: fenland_council_tax_reduction_weekly_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Fenland Council Tax Reduction Scheme 2026/2027 paragraphs 17 and 32
    metadata:
      proof:
        atoms:
          - path: "versions[0].formula"
            kind: formula
            source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-42, excerpt: "80% of the amount found by deducting amount B from amount A"}
          - path: "versions[0].formula"
            kind: formula
            source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-37, excerpt: "less any deductions in respect of non- dependants"}
          - path: "versions[0].formula"
            kind: condition
            source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-23, excerpt: "whose income (if any) for the relevant week is less than his applicable amount"}
          - path: "versions[0].formula"
            kind: condition
            source: {corpus_citation_path: uk-fenland/manual/council-tax-reduction-scheme-2026-2027/page-24, excerpt: "whose income for the relevant week is greater than his applicable amount"}
    versions: [{effective_from: '2026-04-01', formula: 'if local_authority_is_fenland and would_claim_council_tax_reduction and fenland_council_tax_reduction_working_age_scheme_applies and fenland_council_tax_reduction_capital_eligible and not fenland_council_tax_reduction_class_f_applies and (fenland_council_tax_reduction_assessed_income_weekly < fenland_council_tax_reduction_applicable_amount_weekly or (fenland_council_tax_reduction_assessed_income_weekly > fenland_council_tax_reduction_applicable_amount_weekly and fenland_council_tax_reduction_eligible_liability_weekly - fenland_council_tax_reduction_non_dependant_deductions_weekly > fenland_council_tax_reduction_excess_income_weekly * fenland_council_tax_reduction_weekly_taper_rate)): max(0, (fenland_council_tax_reduction_eligible_liability_weekly - fenland_council_tax_reduction_non_dependant_deductions_weekly - fenland_council_tax_reduction_excess_income_weekly * fenland_council_tax_reduction_weekly_taper_rate) * fenland_council_tax_reduction_maximum_support_rate) else: 0'}]
inputs:
  - {name: local_authority_is_fenland, entity: Household, dtype: Boolean, period: Week}
  - {name: would_claim_council_tax_reduction, entity: Household, dtype: Boolean, period: Week}
  - {name: fenland_council_tax_reduction_working_age_scheme_applies, entity: Household, dtype: Boolean, period: Week}
  - {name: fenland_council_tax_reduction_class_f_applies, entity: Household, dtype: Boolean, period: Week}
  - {name: fenland_council_tax_reduction_assessed_capital_weekly, entity: Household, dtype: Money, period: Week, unit: GBP}
  - {name: fenland_council_tax_reduction_assessed_income_weekly, entity: Household, dtype: Money, period: Week, unit: GBP}
  - {name: fenland_council_tax_reduction_applicable_amount_weekly, entity: Household, dtype: Money, period: Week, unit: GBP}
  - {name: fenland_council_tax_reduction_eligible_liability_weekly, entity: Household, dtype: Money, period: Week, unit: GBP}
  - {name: fenland_council_tax_reduction_non_dependant_deductions_weekly, entity: Household, dtype: Money, period: Week, unit: GBP}
