format: rulespec/v1
module:
  proof_validation: {required: true}
  source_verification:
    corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-30
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to West Northamptonshire Council, so its adopted scheme document is the operative legal source for the locally set working-age values.
  summary: Working-age only. Standard maximum support is 80 per cent; qualifying care leavers under 25 and working-age war-widows' or war-disablement-pension recipients receive 100 per cent. Pension-age and alternative-maximum provisions are outside this award-surface module.
  deferred_outputs:
    - {output: uk-west-northamptonshire:policies/west-northamptonshire/council-tax-reduction/paragraphs-26-to-28-and-schedule-3#applicable_amount, reason: Applicable-amount schedules and premiums are consumed as an assessed input.}
    - {output: uk-west-northamptonshire:policies/west-northamptonshire/council-tax-reduction/parts-10-to-12#assessed_income_and_capital, reason: Income and capital assessment, disregards and valuation are outside this award surface.}
    - {output: uk-west-northamptonshire:policies/west-northamptonshire/council-tax-reduction/paragraph-30-subparagraphs-3-to-11#non_dependant_exemptions_and_aggregation, reason: This module encodes the printed deduction bands and consumes the household deduction total.}
rules:
  - name: west_northamptonshire_council_tax_reduction_standard_support_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 29(2)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-27, excerpt: "80 per cent of the amount A/B"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 0.80}]
  - name: west_northamptonshire_council_tax_reduction_protected_support_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 29(2A)-(2B)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-27, excerpt: "100 per cent of the amount A/B"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 1}]
  - name: west_northamptonshire_council_tax_reduction_taper_whole_percentage_points
    kind: parameter
    dtype: Number
    period: Year
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 17(f)(ii)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-17, excerpt: "amount B is 2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 2}]
  - name: west_northamptonshire_council_tax_reduction_taper_fraction_numerator
    kind: parameter
    dtype: Number
    period: Year
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 17(f)(ii)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-17, excerpt: "amount B is 2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 6}]
  - name: west_northamptonshire_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    period: Year
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 30
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-28, excerpt: "£15.95 x 1/7"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 7}]
  - name: west_northamptonshire_council_tax_reduction_per_cent_unit
    kind: parameter
    dtype: Rate
    period: Year
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 percentage notation
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-27, excerpt: "100 per cent of the amount A/B"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 0.01}]
  - name: west_northamptonshire_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 23
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-25, excerpt: "capital exceeds £16,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 16000}]
  - name: west_northamptonshire_council_tax_reduction_tariff_income_threshold
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 72
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-66, excerpt: "£1 for each £250 in excess of £6,000 but not exceeding £16,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 6000}]
  - name: west_northamptonshire_council_tax_reduction_tariff_income_step
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 72
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-66, excerpt: "£1 for each £250 in excess of £6,000 but not exceeding £16,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 250}]
  - name: west_northamptonshire_council_tax_reduction_tariff_income_weekly_amount_per_step
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 72
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-66, excerpt: "£1 for each £250 in excess of £6,000 but not exceeding £16,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 1}]
  - name: west_northamptonshire_council_tax_reduction_weeks_per_year
    kind: parameter
    dtype: Number
    period: Year
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 weekly tariff-income rule
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-29, excerpt: "52 weeks"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 52}]
  - name: west_northamptonshire_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: west_northamptonshire_council_tax_reduction_non_dependant_deduction_band
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 30
    metadata: {proof: {atoms: [{path: "versions[0].values", kind: parameter_table, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-28, excerpt: "(a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7. (2) In the case of a non-dependant aged 18 or over to whom paragraph 30.1(a) applies, where it is shown to the appropriate authority that his normal gross weekly income is– (a) less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 30.1(b); (b) not less than £279.00, but less than £485.00, the deduction to be made under this section shall be £10.60 x1/7; (c) not less than £485.00, but less than £605.00, the deduction to be made under this section shall be £13.30 x 1/7.", table: {header: "paragraph 30", row_key: "deduction band", column_key: "weekly deduction"}}}]}}
    versions: [{effective_from: '2026-04-01', values: {0: 0, 1: 5.20, 2: 10.60, 3: 13.30, 4: 15.95}}]
  - name: west_northamptonshire_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 17(f)(ii), derived from its printed mixed-number percentage
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-17, excerpt: "amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "(west_northamptonshire_council_tax_reduction_taper_whole_percentage_points + west_northamptonshire_council_tax_reduction_taper_fraction_numerator / west_northamptonshire_council_tax_reduction_days_per_week) * west_northamptonshire_council_tax_reduction_per_cent_unit"}]
  - name: west_northamptonshire_council_tax_reduction_annual_taper_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 17(f)(ii), annualized from its printed weekly mixed-number percentage
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-17, excerpt: "amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "west_northamptonshire_council_tax_reduction_weekly_taper_rate * west_northamptonshire_council_tax_reduction_weeks_per_year / west_northamptonshire_council_tax_reduction_weeks_per_year"}]
  - name: west_northamptonshire_council_tax_reduction_support_rate
    kind: derived
    entity: Household
    dtype: Rate
    period: Year
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 29(2)-(2B)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-27, excerpt: "In the case of Care Leavers who are aged up to 25 years"}}, {path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-27, excerpt: "persons of working age who are in receipt of war widows or war disablement pensions"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "if west_northamptonshire_council_tax_reduction_is_care_leaver_under_25 or west_northamptonshire_council_tax_reduction_receives_war_pension: west_northamptonshire_council_tax_reduction_protected_support_rate else: west_northamptonshire_council_tax_reduction_standard_support_rate"}]
  - name: west_northamptonshire_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 23
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-25, excerpt: "capital exceeds £16,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "west_northamptonshire_council_tax_reduction_assessed_capital_for_year <= west_northamptonshire_council_tax_reduction_capital_limit"}]
  - name: west_northamptonshire_council_tax_reduction_tariff_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 72
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-66, excerpt: "£1 for each £250 in excess of £6,000 but not exceeding £16,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "if west_northamptonshire_council_tax_reduction_assessed_capital_for_year > west_northamptonshire_council_tax_reduction_tariff_income_threshold: ceil((west_northamptonshire_council_tax_reduction_assessed_capital_for_year - west_northamptonshire_council_tax_reduction_tariff_income_threshold) / west_northamptonshire_council_tax_reduction_tariff_income_step) * west_northamptonshire_council_tax_reduction_tariff_income_weekly_amount_per_step * west_northamptonshire_council_tax_reduction_weeks_per_year else: west_northamptonshire_council_tax_reduction_capital_limit - west_northamptonshire_council_tax_reduction_capital_limit"}]
  - name: west_northamptonshire_council_tax_reduction_maximum_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 29(2)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-27, excerpt: "80 per cent of the amount A/B"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "west_northamptonshire_council_tax_reduction_actual_liability_for_year * west_northamptonshire_council_tax_reduction_support_rate - west_northamptonshire_council_tax_reduction_non_dependant_deductions_for_year"}]
  - name: west_northamptonshire_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 17(f)(ii)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-17, excerpt: "difference between his income for the relevant week and his applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "max(west_northamptonshire_council_tax_reduction_assessed_income_for_year + west_northamptonshire_council_tax_reduction_tariff_income_for_year - west_northamptonshire_council_tax_reduction_applicable_amount_for_year, west_northamptonshire_council_tax_reduction_capital_limit - west_northamptonshire_council_tax_reduction_capital_limit)"}]
  - name: west_northamptonshire_council_tax_reduction_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 17(f)(ii)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-17, excerpt: "amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "west_northamptonshire_council_tax_reduction_excess_income_for_year * west_northamptonshire_council_tax_reduction_annual_taper_rate"}]
  - name: west_northamptonshire_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraphs 16, 17 and 23
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-17, excerpt: "whose income (if any) for the relevant week is less than his applicable amount"}}, {path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-17, excerpt: "whose income for the relevant week is greater than his applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "west_northamptonshire_council_tax_reduction_applicant_is_not_pensioner and west_northamptonshire_council_tax_reduction_capital_eligible and would_claim_council_tax_reduction and (west_northamptonshire_council_tax_reduction_assessed_income_for_year + west_northamptonshire_council_tax_reduction_tariff_income_for_year < west_northamptonshire_council_tax_reduction_applicable_amount_for_year or west_northamptonshire_council_tax_reduction_assessed_income_for_year + west_northamptonshire_council_tax_reduction_tariff_income_for_year > west_northamptonshire_council_tax_reduction_applicable_amount_for_year and west_northamptonshire_council_tax_reduction_maximum_for_year > west_northamptonshire_council_tax_reduction_taper_deduction_for_year)"}]
  - name: west_northamptonshire_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: West Northamptonshire Council Tax Reduction Scheme 2026-27 paragraph 32(2)-(3)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-31, excerpt: "Where the person is within class A or D, that amount is the amount which is the maximum council tax reduction"}}, {path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-west-northamptonshire/manual/council-tax-reduction-scheme-2026-2027/page-31, excerpt: "Where the person is within class B or E, that amount is the amount found by deducting amount B from amount A"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "if west_northamptonshire_council_tax_reduction_award_conditions_met: max(west_northamptonshire_council_tax_reduction_capital_limit - west_northamptonshire_council_tax_reduction_capital_limit, west_northamptonshire_council_tax_reduction_maximum_for_year - west_northamptonshire_council_tax_reduction_taper_deduction_for_year) else: west_northamptonshire_council_tax_reduction_capital_limit - west_northamptonshire_council_tax_reduction_capital_limit"}]
inputs:
  - {name: west_northamptonshire_council_tax_reduction_applicant_is_not_pensioner, entity: Household, dtype: Boolean, period: Year}
  - {name: would_claim_council_tax_reduction, entity: Household, dtype: Boolean, period: Year}
  - {name: west_northamptonshire_council_tax_reduction_is_care_leaver_under_25, entity: Household, dtype: Boolean, period: Year}
  - {name: west_northamptonshire_council_tax_reduction_receives_war_pension, entity: Household, dtype: Boolean, period: Year}
  - {name: west_northamptonshire_council_tax_reduction_assessed_capital_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: west_northamptonshire_council_tax_reduction_actual_liability_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: west_northamptonshire_council_tax_reduction_assessed_income_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: west_northamptonshire_council_tax_reduction_applicable_amount_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: west_northamptonshire_council_tax_reduction_non_dependant_deductions_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: west_northamptonshire_council_tax_reduction_non_dependant_deduction_band, entity: Household, dtype: Number, period: Week}
