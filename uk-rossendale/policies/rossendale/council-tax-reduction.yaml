      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-rossendale/manual/council-tax-reduction-scheme-2026-2027/page-61
              excerpt: "Where the applicant’s capital calculated in accordance with this scheme exceeds £6,000 it shall be treated as equivalent to a weekly income of £1 for each complete £250 of in excess of £6,000 but not exceeding £16,000."
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-rossendale/manual/council-tax-reduction-scheme-2026-2027/page-61
              excerpt: "where any part of the excess is not a complete £250 that part shall be treated as equivalent to a weekly tariff income of £1."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          rossendale_council_tax_reduction_tariff_income_weekly_amount_per_step * ceil(max(0, rossendale_council_tax_reduction_assessed_capital - rossendale_council_tax_reduction_tariff_income_threshold) / rossendale_council_tax_reduction_tariff_income_step)

  - name: rossendale_council_tax_reduction_taper_deduction_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Rossendale Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
