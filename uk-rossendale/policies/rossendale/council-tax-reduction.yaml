              excerpt: "shall be 2 6/7 per cent."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (rossendale_council_tax_reduction_taper_whole_percentage_points + rossendale_council_tax_reduction_taper_fraction_numerator / rossendale_council_tax_reduction_days_per_week) * rossendale_council_tax_reduction_per_cent_unit

