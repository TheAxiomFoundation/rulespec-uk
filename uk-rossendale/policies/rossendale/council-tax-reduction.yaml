format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-rossendale/manual/council-tax-reduction-scheme-2026-2027/page-76
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths:
    #     - uk/statutes/ukpga/1992/14/13A
    #     - uk/regulations/uksi/2012/2885
    #     - uk/regulations/uksi/2012/2886
    #   rationale: Section 13A of the Local Government Finance Act 1992 delegates the working-age scheme to Rossendale Borough Council, so the adopted scheme document is the operative legal source for its locally set working-age values.
  summary: |-
    Rossendale's adopted 2026-27 working-age scheme awards Class D where income is strictly below the applicable amount or the applicant or partner receives a qualifying income-related benefit, and Class E where income is strictly above it and the maximum exceeds the taper. It calculates the section 57 maximum less non-dependant deductions, deducts excess income at 2 6/7 per cent daily, then applies the 20% standard deduction. Capital above £16,000 is an eligibility cliff; capital above £6,000 and no more than £16,000 produces £1 weekly tariff income for each complete £250 or part thereof. No minimum-award floor or council-tax-band cap is printed. Pension-age and the separate second-adult rebate are out of scope.
  deferred_outputs:
    - output: uk-rossendale:policies/rossendale/council-tax-reduction/schedule-1#applicable_amount
      reason: The category-specific personal allowances, premiums, components, and transitional additions used to calculate the applicable amount are outside this award-surface module.
    - output: uk-rossendale:policies/rossendale/council-tax-reduction/sections-15-to-40-and-schedules-3-to-5#assessed_income_and_capital
      reason: Detailed income disregards, attribution, and capital valuation are outside this award-surface module.
    - output: uk-rossendale:policies/rossendale/council-tax-reduction/class-c#alternative_maximum_council_tax_reduction
      reason: The separate pension-age second-adult rebate is outside this working-age Class D and E module.
rules:
  - name: rossendale_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Rossendale Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-rossendale/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "shall be 100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: rossendale_council_tax_reduction_daily_taper_rate
    kind: parameter
    dtype: Rate
    period: Day
