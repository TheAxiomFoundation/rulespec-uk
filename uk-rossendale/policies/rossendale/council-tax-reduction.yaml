        formula: |-
          rossendale_council_tax_reduction_excess_income_weekly * rossendale_council_tax_reduction_weekly_taper_rate

  - name: rossendale_council_tax_reduction_amount_before_eligibility_weekly
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Rossendale Council Tax Reduction Scheme 2026/27 paragraph 59.1
    metadata:
