        formula: |-
          if rossendale_council_tax_reduction_non_dependant_deduction_applies: rossendale_council_tax_reduction_non_dependant_deduction_by_band[rossendale_council_tax_reduction_non_dependant_band] else: 0

  - name: rossendale_council_tax_reduction_maximum_weekly_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Rossendale Council Tax Reduction Scheme 2026/27 paragraph 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-rossendale/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "shall be 100 per cent, of the amount A divided by B"
          - path: versions[0].formula
            kind: ordering
            source:
              corpus_citation_path: uk-rossendale/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "less any deductions in respect of non-dependants which fall to be made under section 58"
