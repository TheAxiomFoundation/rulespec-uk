        formula: |-
          rossendale_council_tax_reduction_assessed_income_weekly > rossendale_council_tax_reduction_applicable_amount_weekly and rossendale_council_tax_reduction_maximum_weekly_amount > rossendale_council_tax_reduction_taper_deduction_weekly

  - name: rossendale_council_tax_reduction_individual_non_dependant_deduction_weekly
    kind: derived
    entity: Person
