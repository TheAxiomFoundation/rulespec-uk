        formula: |-
          if rossendale_council_tax_reduction_non_dependant_normal_gross_weekly_income < rossendale_council_tax_reduction_non_dependant_middle_threshold: rossendale_council_tax_reduction_non_dependant_band_codes[0] else: if rossendale_council_tax_reduction_non_dependant_normal_gross_weekly_income < rossendale_council_tax_reduction_non_dependant_high_threshold: rossendale_council_tax_reduction_non_dependant_band_codes[1] else: if rossendale_council_tax_reduction_non_dependant_normal_gross_weekly_income < rossendale_council_tax_reduction_non_dependant_top_threshold: rossendale_council_tax_reduction_non_dependant_band_codes[2] else: rossendale_council_tax_reduction_non_dependant_band_codes[3]

