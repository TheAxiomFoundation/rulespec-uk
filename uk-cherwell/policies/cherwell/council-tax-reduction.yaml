              corpus_citation_path: uk-cherwell/manual/council-tax-reduction-scheme-2026-2027/page-32
              excerpt: "Working age non-passported other Income Band Excess Income CTR Award based on Council Tax Liability"
              table:
                header: Working-age award grid
                row_key: client group and income band
                column_key: CTR percentage
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if cherwell_council_tax_reduction_is_passported_or_war_pensioner: cherwell_council_tax_reduction_passported_award_rate else: if cherwell_council_tax_reduction_is_non_passported_disabled: cherwell_council_tax_reduction_disabled_award_rate_by_band[cherwell_council_tax_reduction_income_band] else: if cherwell_council_tax_reduction_is_non_passported_with_children: cherwell_council_tax_reduction_children_award_rate_by_band[cherwell_council_tax_reduction_income_band] else: cherwell_council_tax_reduction_other_award_rate_by_band[cherwell_council_tax_reduction_income_band]

