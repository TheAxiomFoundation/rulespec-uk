  - name: cherwell_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Cherwell Council Tax Reduction Scheme 2026/27 Classes D and E
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-cherwell/manual/council-tax-reduction-scheme-2026-2027/page-16
              excerpt: "Class D: persons who are not pensioners who are entitled to maximum reduction under this scheme."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-cherwell/manual/council-tax-reduction-scheme-2026-2027/page-16
              excerpt: "Class E: persons who are not pensioners whose calculated excess income is higher than Band 1"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_cherwell and council_tax_reduction_household_in_england and cherwell_council_tax_reduction_applicant_is_working_age and would_claim_council_tax_reduction

  - name: cherwell_council_tax_reduction_annual_amount
    kind: derived
