  - name: cherwell_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: cherwell_council_tax_reduction_non_dependant_deduction_band
    source: Cherwell Council Tax Reduction Scheme 2026/27 paragraph 30
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-cherwell/manual/council-tax-reduction-scheme-2026-2027/page-29
              excerpt: "(a) in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.20 x 1/7. (2) In the case of a non-dependant aged 18 or over to whom paragraph 58.1(a) applies, where it is shown to the appropriate authority that his normal gross weekly income is– (a) less than £279.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £279.00, but less than £463.00, the deduction to be made under this section shall be £10.20 x1/7 (c) not less than £463.00, but less than £554.00, the deduction to be made under this section shall be £13.30 x 1/7."
              table:
                header: Non-dependent deductions
                row_key: deduction band
                column_key: weekly deduction
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 0
          1: 5.20
          2: 10.20
          3: 13.30
          4: 15.95

