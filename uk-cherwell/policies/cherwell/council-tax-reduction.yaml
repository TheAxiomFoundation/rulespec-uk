  - name: cherwell_council_tax_reduction_capital_eligible
    kind: derived
    entity: Person
    dtype: Judgment
    period: Year
    source: Cherwell Council Tax Reduction Scheme 2026/27 paragraph 23
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-cherwell/manual/council-tax-reduction-scheme-2026-2027/page-26
              excerpt: "any person whose capital exceeds £16,000"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          cherwell_council_tax_reduction_assessed_capital_for_year <= cherwell_council_tax_reduction_capital_limit

  - name: cherwell_council_tax_reduction_tariff_income_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Cherwell Council Tax Reduction Scheme 2026/27 paragraph 72
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-cherwell/manual/council-tax-reduction-scheme-2026-2027/page-64
              excerpt: "£1 for any excess which is not a complete £250"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          cherwell_council_tax_reduction_tariff_income_weekly_amount_per_step * ceil(max(0, cherwell_council_tax_reduction_assessed_capital_for_year - cherwell_council_tax_reduction_tariff_income_threshold) / cherwell_council_tax_reduction_tariff_income_step)

  - name: cherwell_council_tax_reduction_income_band
    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: Cherwell Council Tax Reduction Scheme 2026/27 paragraph 32(7)-(8)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-cherwell/manual/council-tax-reduction-scheme-2026-2027/page-31
              excerpt: "The income band is the number allocated to the excess income range and related percentage. (8) The income range is the applicant and partner’s weekly excess income"
              table:
                header: Working-age income bands
                row_key: weekly excess income
                column_key: income band
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if cherwell_council_tax_reduction_weekly_excess_income >= cherwell_council_tax_reduction_band_lower_excess_income[cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_eight]]: cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_eight] else: if cherwell_council_tax_reduction_weekly_excess_income >= cherwell_council_tax_reduction_band_lower_excess_income[cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_seven]]: cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_seven] else: if cherwell_council_tax_reduction_weekly_excess_income >= cherwell_council_tax_reduction_band_lower_excess_income[cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_six]]: cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_six] else: if cherwell_council_tax_reduction_weekly_excess_income >= cherwell_council_tax_reduction_band_lower_excess_income[cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_five]]: cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_five] else: if cherwell_council_tax_reduction_weekly_excess_income >= cherwell_council_tax_reduction_band_lower_excess_income[cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_four]]: cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_four] else: if cherwell_council_tax_reduction_weekly_excess_income >= cherwell_council_tax_reduction_band_lower_excess_income[cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_three]]: cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_three] else: if cherwell_council_tax_reduction_weekly_excess_income >= cherwell_council_tax_reduction_band_lower_excess_income[cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_two]]: cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_two] else: cherwell_council_tax_reduction_income_band_code[cherwell_council_tax_reduction_income_band_ordinal_one]

  - name: cherwell_council_tax_reduction_selected_award_rate
