format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-cherwell/manual/council-tax-reduction-scheme-2026-2027/page-31
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A delegates the working-age scheme to Cherwell District Council, so the adopted scheme is operative. The pinned singular source-verification contract rejects and strips this attestation as a live field.
  summary: >-
    Cherwell's locally determined working-age scheme is a directly-liability-based
    banded award. Pension-age prescribed provisions and detailed applicable-amount,
    income-calculation and capital-disregard schedules are outside this award surface.
  deferred_outputs:
    - output: uk-cherwell:policies/cherwell/council-tax-reduction/part-6-and-schedule-3#applicable_weekly_amount
      reason: Applicable-amount schedules are consumed as an assessed input.
    - output: uk-cherwell:policies/cherwell/council-tax-reduction/part-10-and-schedule-10#assessed_capital
      reason: Capital valuation and disregard rules are outside this award surface.
    - output: uk-cherwell:policies/cherwell/council-tax-reduction/part-10#assessed_weekly_excess_income
      reason: Income and excess-income calculations are consumed as an assessed input.
    - output: uk-cherwell:policies/cherwell/council-tax-reduction/paragraph-30.6-to-30.10#non_dependant_protection_or_exemption
      reason: The detailed protected and exempt non-dependant classifier is consumed as an input.
