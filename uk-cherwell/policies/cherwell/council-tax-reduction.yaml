    kind: parameter
    dtype: Rate
    source: Cherwell Council Tax Reduction Scheme 2026/27 paragraph 29(2)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-cherwell/manual/council-tax-reduction-scheme-2026-2027/page-28
              excerpt: "the maximum council tax reduction payable to a person who is not a pensioner in respect of a day is 100 per cent"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

