format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-wirral/manual/council-tax-reduction-scheme-2026-2027/page-63
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Wirral Metropolitan Borough Council, so the adopted scheme document is operative. The pinned singular source-verification contract strips this attestation as a live field.
  summary: |-
    Wirral's operative 2026-27 local working-age Council Tax Reduction scheme is a five-band weekly-income grid. Its defined maximum is 50 percent of actual discounted liability capped at Band D, less the daily £5/7 deduction for each non-dependant after the printed protections and coordination rules. The Schedule 1 linkage bases the selected 50, 40, 30, 20, or zero percent band on that defined maximum, so this module composes the band rate onto the maximum after the non-dependant deduction. Capital of £6,000 or more is a cliff. Income Support, income-related ESA, and income-based JSA route an applicant or partner to Band 1, while capital still excludes the award. The local working-age scheme also covers a pension-credit-age applicant or partner with one of the qualifying benefits named in section 1.7, including Universal Credit; Universal Credit is not separately stated to passport the Schedule 1 band. The working-age text prints no tariff-income rule or minimum-entitlement floor. Pension-age provisions, including their taper, are out of scope.
  deferred_outputs:
    - output: uk-wirral:policies/wirral/council-tax-reduction/sections-11-to-25-and-schedules-2-and-4#assessed_weekly_net_income
      reason: Detailed income assessment, disregards, attribution, and family definitions feed the Schedule 1 weekly-income input and remain outside this award-surface module.
    - output: uk-wirral:policies/wirral/council-tax-reduction/sections-26-to-34-and-schedule-3#assessed_capital_for_year
      reason: Detailed capital valuation, attribution, and disregard rules remain outside this module; this module applies the printed £6,000 cliff.
    - output: uk-wirral:policies/wirral/council-tax-reduction/paragraphs-48.0-to-48.3#annual_council_tax_liability_after_statutory_discounts_and_apportionment
      reason: The award surface applies the printed Band D cap to a liability already adjusted for statutory discounts and joint-liability apportionment.
    - output: uk-wirral:policies/wirral/council-tax-reduction/paragraphs-48A.2-to-48A.6#non_dependant_deduction_units_after_person_exemptions
      reason: Couple coordination, resident-level exemptions, and apportionment determine the non-dependant units consumed by this award surface.
    - output: uk-wirral:policies/wirral/council-tax-reduction/section-1.7#pension_credit_age_applicant_or_partner_has_qualifying_benefit
      reason: The state-pension-credit-age and applicant-or-partner benefit classification determines section 1.7's exception to the ordinary local working-age class.
    - output: uk-wirral:policies/wirral/council-tax-reduction/class-c#alternative_maximum_council_tax_reduction
      reason: The pension-age Class C alternative maximum reduction is a separate calculation outside this working-age local award surface.

