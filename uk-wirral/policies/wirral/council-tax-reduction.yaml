            kind: condition
            source:
              corpus_citation_path: uk-wirral/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "THE SCHEME FOR WORKING AGE APPLICANTS -THE COUNCIL'S LOCAL SCHEME"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-wirral/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "this scheme only applies to a person who; (a) has not attained the qualifying age for state pension credit; or (b) has attained the qualifying age for state pension credit if he, or his partner, is a person on income support, on an income-based jobseeker's allowance, on an income-related employment and support allowance or on universal credit."
          - path: versions[0].formula
            kind: condition
            source:
