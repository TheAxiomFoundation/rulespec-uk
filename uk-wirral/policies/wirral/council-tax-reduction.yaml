  - name: wirral_council_tax_reduction_applicant_is_in_local_working_age_scheme_class
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Wirral Council Tax Reduction Scheme 2026/27 section 1.7
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-wirral/manual/council-tax-reduction-scheme-2026-2027/page-7
              excerpt: "this scheme only applies to a person who; (a) has not attained the qualifying age for state pension credit; or (b) has attained the qualifying age for state pension credit if he, or his partner, is a person on income support, on an income-based jobseeker's allowance, on an income-related employment and support allowance or on universal credit."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          wirral_council_tax_reduction_applicant_is_working_age
          or wirral_council_tax_reduction_receives_income_support
          or wirral_council_tax_reduction_receives_income_related_esa
          or wirral_council_tax_reduction_receives_income_based_jsa
          or wirral_council_tax_reduction_receives_universal_credit

  - name: wirral_council_tax_reduction_working_age_scheme_applies
