# Companions for Arun's 2026/27 working-age (Class D) scheme. Every expected value is
# derived by hand from the scheme text. Where the exact value is a repeating decimal,
# the case quotes the engine's 28-place string, which agrees with the hand-derived
# fraction shown in the comment to within 2e-25. The rules applied:
#   section 21(1): daily maximum = 100% x A/B, less non-dependant deductions;
#   section 22(1): £5.00 x 1/7 a day for each chargeable non-dependant;
#   section 23(2)-(3): band A 100%, B 70%, C 50%, D 30%, E 10% of that maximum,
#     selected by weekly income (Schedule 3 paragraph 4); above £470.99 no band;
#   section 21(7): nothing payable where entitlement is less than £1 a week (the
#     weekly entitlement is 7A/B less £5.00 a week per chargeable non-dependant,
#     times the band rate);
#   section 19: capital above £6,000 excludes; Schedule 3 paragraph 8: relevant
#     benefits take band A; Schedule 7 paragraph 8: the whole capital of an applicant
#     on one of them is disregarded.
# Unless a case says otherwise: A = £3,650 and B = 365 days, so A/B = £10.00 a day
# (£70.00 a week), with no non-dependants, no capital and no relevant benefit.
# The scheme is banded, so it has no excess-income taper to step-test; the
# within-band cases show that more income inside a band leaves the award unchanged.

- name: arun_ctr_parameters
  period: {period_kind: tax_year, start: '2026-04-01', end: '2027-03-31'}
  input:
    uk-arun:policies/arun/council-tax-reduction#input.local_authority_is_arun: true
    uk-arun:policies/arun/council-tax-reduction#input.council_tax_reduction_household_in_england: true
    uk-arun:policies/arun/council-tax-reduction#input.would_claim_council_tax_reduction: true
    uk-arun:policies/arun/council-tax-reduction#input.arun_council_tax_reduction_applicant_is_working_age: true
    uk-arun:policies/arun/council-tax-reduction#input.arun_council_tax_reduction_applicant_or_partner_on_income_support: false
    uk-arun:policies/arun/council-tax-reduction#input.arun_council_tax_reduction_applicant_or_partner_on_income_related_esa: false
    uk-arun:policies/arun/council-tax-reduction#input.arun_council_tax_reduction_applicant_or_partner_on_income_based_jsa: false
    uk-arun:policies/arun/council-tax-reduction#input.arun_council_tax_reduction_assessed_capital_for_year: 0
    uk-arun:policies/arun/council-tax-reduction#input.arun_council_tax_reduction_assessed_weekly_income: 0
    uk-arun:policies/arun/council-tax-reduction#input.arun_council_tax_reduction_eligible_liability_for_year: 3650
    uk-arun:policies/arun/council-tax-reduction#input.arun_council_tax_reduction_number_of_days_in_financial_year: 365
    uk-arun:policies/arun/council-tax-reduction#input.arun_council_tax_reduction_non_dependant_deduction_band: 0
    uk-arun:policies/arun/council-tax-reduction#input.arun_council_tax_reduction_chargeable_non_dependant_count: 0
  output:
    # Printed values: s.21(1) 100 per cent; s.19(1) £6,000; s.22(1) "x 1/7";
    # s.21(7) £1 per week; s.23(3) band codes A-E = 1-5 and their upper limits.
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_maximum_support_rate: 1
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_capital_limit: 6000
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_days_per_week: 7
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_minimum_award_weekly: 1
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_band_1: 1
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_band_2: 2
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_band_3: 3
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_band_4: 4
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_band_5: 5
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_band_1_upper_income: 219.99
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_band_2_upper_income: 279.99
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_band_3_upper_income: 345.99
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_band_4_upper_income: 405.99
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_band_5_upper_income: 470.99
    # Deduction band 0 (exempt under s.22(2)) carries no deduction.
    uk-arun:policies/arun/council-tax-reduction#arun_council_tax_reduction_non_dependant_weekly_deduction_by_band: 0

