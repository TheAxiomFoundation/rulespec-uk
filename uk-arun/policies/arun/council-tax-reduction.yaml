    versions: [{effective_from: '2026-04-01', formula: "if local_authority_is_arun and council_tax_reduction_household_in_england and arun_council_tax_reduction_applicant_is_working_age and would_claim_council_tax_reduction and arun_council_tax_reduction_capital_eligible: if arun_council_tax_reduction_weekly_entitlement < arun_council_tax_reduction_minimum_award_weekly: 0 else: arun_council_tax_reduction_maximum_for_day * arun_council_tax_reduction_support_rate_by_income_band[arun_council_tax_reduction_income_band] * arun_council_tax_reduction_number_of_days_in_financial_year else: 0"}]
