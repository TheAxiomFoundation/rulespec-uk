format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-28
    # upstream_source_check: {status: delegated_scheme, checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886], rationale: Section 13A delegates the working-age scheme to Arun District Council, so the adopted document is operative.}
  summary: |-
    Arun's adopted 2026/27 working-age scheme (Class D) is an income-banded discount, not an excess-income taper. Section 3 and paragraph 1.6 limit it to persons who are not pensioners: under the qualifying age for state pension credit, or over it with the applicant or partner on Income Support, income-based JSA, income-related ESA or Universal Credit. The applicant_is_working_age input carries that test. The 2 6/7 per cent taper on page 5 belongs to the prescribed pension-age Class B and is outside this module.

    Section 23(2) applies the band percentage to the section 21 maximum. That maximum is 100 per cent of the daily liability A/B, less a non-dependant deduction of £5.00 x 1/7 a day for each chargeable non-dependant (section 22), so the deduction comes off before the band rate, not after it. Weekly income (Schedule 3 paragraph 4) selects band A (£0 to £219.99, 100 per cent), B (£220.00 to £279.99, 70), C (£280.00 to £345.99, 50), D (£346.00 to £405.99, 30) or E (£406.00 to £470.99, 10). Income above £470.99 falls in no band and gets no reduction. Schedule 3 paragraph 8 awards band A to an applicant or partner receiving Income Support, income-related ESA or income-based JSA, whatever their assessed income. Schedule 7 paragraph 8 disregards the whole capital of an applicant "on" one of those benefits, as section 2(3) and (4) define it, and the benefit inputs follow that definition. Otherwise capital above £6,000 excludes entitlement (section 19), and the scheme prints no tariff-income rule. No reduction is payable where entitlement is less than £1 a week (section 21(7)).

    Band A conflict and ruling. Section 23(3) on page 28 prints band A at 100 per cent. Schedule 3 paragraph 1 on page 80 prints 90 per cent for the same band "from 2026/27". Bands B to E agree. On 10 October 2026 the maintainer ruled that section 23(3) governs, because section 23(4) says "A summary of the entitlement is shown within Schedule 3". This module therefore encodes 100 per cent.

    Income grid uprating (open). Schedule 3 paragraph 7 uprates the grid each year by CPI at 1 October before the financial year. This module encodes the figures that section 23(2) and (3) print "for 2026/27". Arun's council tax reduction web page, retrieved on 11 October 2026 and not part of the bound corpus, prints a higher grid: upper limits of £223.99, £290.99, £359.99, £421.99 and £489.99, with band A at 100 per cent. The printed thresholds may therefore predate the 2026/27 uprating. They stand until a bound source confirms the operative grid.
  deferred_outputs:
    - output: uk-arun:policies/arun/council-tax-reduction/sections-24-to-62-and-schedules#assessed_weekly_income_and_capital
      reason: Income, capital valuation, attribution and disregard calculations (sections 24 to 62 and Schedules 5 to 7) are consumed as assessed weekly income and capital. This module applies only the Schedule 3 paragraph 8 band A route and the Schedule 7 paragraph 8 whole-capital disregard for the relevant benefits.
    - output: uk-arun:policies/arun/council-tax-reduction/paragraph-22#non_dependant_exemption_and_count
      reason: The detailed benefit, student, couple, and apportionment classifier is consumed as inputs to the printed flat deduction.
    - output: uk-arun:policies/arun/council-tax-reduction/paragraph-21#eligible_liability_for_year
      reason: Amount A, the council tax for the dwelling after any discount and any other reduction under the 1992 Act (section 21(1)(a) and (2)), divided among jointly and severally liable persons under section 21(3) to (5), is consumed as an input.
    - output: uk-arun:policies/arun/council-tax-reduction/paragraphs-15-to-18-20-and-51#excluded_classes_and_absence
      reason: Temporary absence (section 15) and the excluded classes of persons treated as not being in Great Britain (section 17), persons subject to immigration control (section 18) and students (sections 20 and 51) are not classified here. The module assumes the applicant is in none of them.
    - output: uk-arun:policies/arun/council-tax-reduction/paragraphs-63-to-75#continuing_and_extended_reductions
      reason: Continuing reductions where state pension credit is claimed (section 64) and extended reductions (sections 65 to 75) depend on benefit-history facts outside this award-surface module.
