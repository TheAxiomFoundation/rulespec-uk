    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-29, excerpt: "£280.00 - £345.99 C 50%"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "arun_council_tax_reduction_band_2 + arun_council_tax_reduction_band_1"}]
  - name: arun_council_tax_reduction_band_4
    kind: parameter
    dtype: Number
    source: Arun Council Tax Reduction Scheme 2026/27 paragraph 23.3
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-29, excerpt: "£346.00 - £405.99 D 30%"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "arun_council_tax_reduction_band_3 + arun_council_tax_reduction_band_1"}]
  - name: arun_council_tax_reduction_band_5
    kind: parameter
    dtype: Number
    source: Arun Council Tax Reduction Scheme 2026/27 paragraph 23.3
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-29, excerpt: "£406.00 - £470.99 E 10% (4) A summary of the entitlement is shown within Schedule 3 of this scheme."}}]}}
    versions: [{effective_from: '2026-04-01', formula: "arun_council_tax_reduction_band_4 + arun_council_tax_reduction_band_1"}]
  - name: arun_council_tax_reduction_band_1_upper_income
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Arun Council Tax Reduction Scheme 2026/27 paragraph 23.3
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-28, excerpt: "£0 - £219.99 A 100%"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "219.99"}]
