    period: Week
    unit: GBP
    source: Arun Council Tax Reduction Scheme 2026/27 paragraph 23.3
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-29, excerpt: "£220.00- £279.99 B 70%"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "279.99"}]
  - name: arun_council_tax_reduction_band_3_upper_income
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Arun Council Tax Reduction Scheme 2026/27 paragraph 23.3
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-29, excerpt: "£280.00 - £345.99 C 50%"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "345.99"}]
