  # Schedule 3 paragraph 8 names the relevant benefits. Section 24(2) applies every
  # reference to the applicant equally to the partner, so the test covers either.
  # The inputs use the scheme's defined "on" test (section 2(3) and (4) include days
  # an income-based JSA or income-related ESA is not paid because of a sanction or
  # waiting day), which Schedule 7 paragraph 8 uses for the capital disregard.
  # Paragraph 8's "in receipt of" group is within it, and the wider group lands in
  # band A anyway: Schedule 6 paragraph 8 disregards the whole of their income.
  - name: arun_council_tax_reduction_on_relevant_benefit
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Arun Council Tax Reduction Scheme 2026/27 Schedule 3 paragraph 8
    metadata:
      proof:
        atoms:
          - path: 'versions[0].formula'
            kind: condition
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-80
              excerpt: "8. Where an applicant or partner is in receipt of a relevant benefit namely Income Support, Income Re­ lated Employment and Support Allowance or Income Based Jobseeker’s Allowance"
          - path: 'versions[0].formula'
            kind: definition
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-29
              excerpt: "(2) The income and capital of any partner of the applicant is to be treated as income and capital of the applicant, and in this scheme any reference to the applicant applies equally to any partner of that applicant."
          - path: 'versions[0].formula'
            kind: definition
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-13
              excerpt: "‘person on income support’ means a person in receipt of income support;"
          - path: 'versions[0].formula'
            kind: definition
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-15
              excerpt: "(3) For the purpose of this scheme, a person is on an income-based jobseeker's allowance on any day in respect of which an income-based jobseeker's allowance is payable to him"
          - path: 'versions[0].formula'
            kind: definition
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-16
              excerpt: "(4) For the purposes of this scheme, a person is on an income-related employment and support allowance on any day in respect of which an income-related employment and support allowance is payable to him"
    versions: [{effective_from: '2026-04-01', formula: "arun_council_tax_reduction_applicant_or_partner_on_income_support or arun_council_tax_reduction_applicant_or_partner_on_income_related_esa or arun_council_tax_reduction_applicant_or_partner_on_income_based_jsa"}]

  # Section 19(2) calculates capital "in accordance with this scheme", and Schedule 7
  # paragraph 8 disregards the whole capital of an applicant on Income Support,
  # income-based JSA or income-related ESA, so the £6,000 limit cannot exclude them.
  - name: arun_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Arun Council Tax Reduction Scheme 2026/27 paragraph 19 and Schedule 7 paragraph 8
    metadata:
      proof:
        atoms:
          - path: 'versions[0].formula'
            kind: condition
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-27
              excerpt: "any person whose capital exceeds £6,000"
          - path: 'versions[0].formula'
            kind: definition
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-27
              excerpt: "Capital for the purposes of sub-paragraph (1) is to be calculated in accordance with this scheme."
          - path: 'versions[0].formula'
            kind: exception
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-101
              excerpt: "8. Where an applicant is on income support, an income-based jobseeker's allowance or an income-related employment and support allowance, the whole of his capital."
    versions: [{effective_from: '2026-04-01', formula: "arun_council_tax_reduction_on_relevant_benefit or arun_council_tax_reduction_assessed_capital_for_year <= arun_council_tax_reduction_capital_limit"}]

  - name: arun_council_tax_reduction_income_band
    kind: derived
    entity: Household
    dtype: Number
    period: Week
    source: Arun Council Tax Reduction Scheme 2026/27 paragraph 23.3 and Schedule 3 paragraphs 4 and 8
    metadata:
      proof:
        atoms:
          - path: 'versions[0].formula'
            kind: parameter_table
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-28
              excerpt: "(3) Income (net) LCTRS Income Banding Percentage award of net liability £0 - £219.99 A 100%"
              table: {header: Income banding, row_key: net income, column_key: income band}
          - path: 'versions[0].formula'
            kind: parameter_table
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-29
              excerpt: "Income (net) LCTRS Income Banding Percentage award of net liability £220.00- £279.99 B 70% £280.00 - £345.99 C 50% £346.00 - £405.99 D 30% £406.00 - £470.99 E 10% (4) A summary of the entitlement is shown within Schedule 3 of this scheme."
              table: {header: Income banding, row_key: net income, column_key: income band}
          - path: 'versions[0].formula'
            kind: unit
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-80
              excerpt: "4 For the sake of clarity all incomes shown within the table above are weekly in accordance with the scheme requirements and definitions."
          - path: 'versions[0].formula'
            kind: exception
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-80
              excerpt: "discount will be awarded in accordance with discount Band A."
          - path: 'versions[0].formula'
            kind: exception
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-89
              excerpt: "8. Where an applicant is on income support, an income-based jobseeker's allowance or an income-related employment and support allowance, the whole of his income."
          - path: 'versions[0].formula'
            kind: condition
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-20
              excerpt: "f. must be a person in respect of whom a day in which s/he is liable to pay council tax falls within a week in respect of which the person’s income falls within the levels for discount prescribed within section 23 and Appendix 3 of this scheme;"
    # A relevant-benefit household takes band A whatever its assessed income
    # (Schedule 3 paragraph 8). Otherwise each upper limit selects its own band at the
    # limit and the next band from £0.01 above it; income above £470.99, or below the
    # £0 floor of band A, is in no printed band (index 0).
    versions: [{effective_from: '2026-04-01', formula: "if arun_council_tax_reduction_on_relevant_benefit: arun_council_tax_reduction_band_1 else: if arun_council_tax_reduction_assessed_weekly_income < 0: 0 else: if arun_council_tax_reduction_assessed_weekly_income <= arun_council_tax_reduction_band_1_upper_income: arun_council_tax_reduction_band_1 else: if arun_council_tax_reduction_assessed_weekly_income <= arun_council_tax_reduction_band_2_upper_income: arun_council_tax_reduction_band_2 else: if arun_council_tax_reduction_assessed_weekly_income <= arun_council_tax_reduction_band_3_upper_income: arun_council_tax_reduction_band_3 else: if arun_council_tax_reduction_assessed_weekly_income <= arun_council_tax_reduction_band_4_upper_income: arun_council_tax_reduction_band_4 else: if arun_council_tax_reduction_assessed_weekly_income <= arun_council_tax_reduction_band_5_upper_income: arun_council_tax_reduction_band_5 else: 0"}]

  - name: arun_council_tax_reduction_non_dependant_deduction_for_day
    kind: derived
    entity: Household
    dtype: Money
    period: Day
    unit: GBP
    source: Arun Council Tax Reduction Scheme 2026/27 paragraph 22.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-28, excerpt: "£5.00 x 1/7"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "arun_council_tax_reduction_non_dependant_weekly_deduction_by_band[arun_council_tax_reduction_non_dependant_deduction_band] * arun_council_tax_reduction_chargeable_non_dependant_count / arun_council_tax_reduction_days_per_week"}]

  # Section 21(1)(b) refers to deductions "under paragraph 30 (non-dependant
  # deductions)", but paragraph 30 of this scheme is the calculation of weekly income
  # of employed earners; the non-dependant deductions are section 22, applied here.
  # Section 21(1) also excepts a person "protected within 29.1A", a provision that
  # appears nowhere in the 111 pages, so no protected class is encoded.
  - name: arun_council_tax_reduction_maximum_for_day
    kind: derived
    entity: Household
    dtype: Money
    period: Day
    unit: GBP
    source: Arun Council Tax Reduction Scheme 2026/27 paragraph 21.1
