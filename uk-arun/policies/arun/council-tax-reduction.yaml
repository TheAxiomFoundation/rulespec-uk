    source: Arun Council Tax Reduction Scheme 2026/27 paragraph 23.3
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-28, excerpt: "£0 - £219.99 A 100%"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "1"}]
  - name: arun_council_tax_reduction_band_2
    kind: parameter
    dtype: Number
    source: Arun Council Tax Reduction Scheme 2026/27 paragraph 23.3
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-29, excerpt: "£220.00- £279.99 B 70%"}}]}}
    versions: [{effective_from: '2026-04-01', formula: "arun_council_tax_reduction_band_1 + arun_council_tax_reduction_band_1"}]
  - name: arun_council_tax_reduction_band_3
    kind: parameter
