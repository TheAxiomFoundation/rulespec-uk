    source: Arun Council Tax Reduction Scheme 2026/27 paragraph 22.1-22.2
    metadata:
      proof:
        atoms:
          # Row 1: the flat £5.00 a week (£5.00 x 1/7 a day) under section 22(1).
          - path: 'versions[0].values'
            kind: parameter_table
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-28
              excerpt: "the non-dependant deduction in respect of every non-dependant ages 18 or over is £5.00 x 1/7 where any of the following apply: (a) Where any non-dependant is in remunerative work; or (b) Where any non-dependant receives no income whatsoever."
              table: {header: Non-dependant deductions, row_key: deduction band, column_key: weekly deduction}
          # Row 0: no deduction for a non-dependant exempted by section 22(2), or one
          # outside section 22(1)'s conditions (under 18, or neither in remunerative
          # work nor without any income), as the row-1 excerpt states them.
          - path: 'versions[0].values'
            kind: parameter_table
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-28
              excerpt: "Irrespective of subsection (1) above, no non-dependant deduction shall be made where the non-de- pendant is in receipt of any of the following:"
              table: {header: Non-dependant deductions, row_key: deduction band, column_key: weekly deduction}
    versions: [{effective_from: '2026-04-01', values: {0: 0, 1: 5}}]

  # Band A (index 1) is 100 per cent, as section 23(3) prints on page 28. Schedule 3
  # paragraph 1 on page 80 prints 90 per cent for band A "from 2026/27"; bands B to E
  # agree in both places. The maintainer ruled on 10 October 2026 that section 23(3)
  # governs, because section 23(4) calls Schedule 3 "A summary of the entitlement".
  # Index 0 is no band (income above £470.99), which carries no award.
  - name: arun_council_tax_reduction_support_rate_by_income_band
    kind: parameter
    dtype: Rate
    indexed_by: arun_council_tax_reduction_income_band
    source: Arun Council Tax Reduction Scheme 2026/27 paragraph 23.3
    metadata:
      proof:
        atoms:
          - path: 'versions[0].values'
            kind: parameter_table
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-28
              excerpt: "(3) Income (net) LCTRS Income Banding Percentage award of net liability £0 - £219.99 A 100%"
              table: {header: Income banding, row_key: income band, column_key: percentage award}
          - path: 'versions[0].values'
            kind: parameter_table
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-29
              excerpt: "Income (net) LCTRS Income Banding Percentage award of net liability £220.00- £279.99 B 70% £280.00 - £345.99 C 50% £346.00 - £405.99 D 30% £406.00 - £470.99 E 10% (4) A summary of the entitlement is shown within Schedule 3 of this scheme."
              table: {header: Income banding, row_key: income band, column_key: percentage award}
          # Row 0: income outside the printed bands is outside Class D.
          - path: 'versions[0].values'
            kind: parameter_table
            source:
              corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-20
              excerpt: "f. must be a person in respect of whom a day in which s/he is liable to pay council tax falls within a week in respect of which the person’s income falls within the levels for discount prescribed within section 23 and Appendix 3 of this scheme;"
