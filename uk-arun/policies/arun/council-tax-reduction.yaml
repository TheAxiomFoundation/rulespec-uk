  # Seven days of the daily award (section 21 maximum after non-dependant deductions,
  # times the band rate), for the section 21(7) test. It multiplies A by seven before
  # dividing by B and deducts the whole £5.00 a week, so an entitlement of exactly
  # £1.00 a week is not lost to the rounding of a division by seven.
  - name: arun_council_tax_reduction_weekly_entitlement
    kind: derived
    entity: Household
    dtype: Money
    period: Week
    unit: GBP
    source: Arun Council Tax Reduction Scheme 2026/27 paragraphs 21, 22 and 23
    metadata:
      proof:
        atoms:
          - path: 'versions[0].formula'
            kind: formula
            source: {corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-28, excerpt: "No council tax reduction shall be payable where any entitlement is less than £1 per week."}
          - path: 'versions[0].formula'
            kind: formula
            source: {corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-27, excerpt: "maximum council tax reduction amount in respect of a day is 100 per cent of the amount A/B"}
          - path: 'versions[0].formula'
            kind: formula
            source: {corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-28, excerpt: "the non-dependant deduction in respect of every non-dependant ages 18 or over is £5.00 x 1/7"}
          - path: 'versions[0].formula'
            kind: formula
            source: {corpus_citation_path: uk-arun/manual/council-tax-reduction-scheme-2026-2027/page-28, excerpt: "The authority has determined that for 2026/27 a discount shall be applied to the maximum council tax reduction determined in section 21 of this scheme in accordance with the following table:"}
    versions: [{effective_from: '2026-04-01', formula: "max(0, arun_council_tax_reduction_eligible_liability_for_year * arun_council_tax_reduction_maximum_support_rate * arun_council_tax_reduction_days_per_week / arun_council_tax_reduction_number_of_days_in_financial_year - arun_council_tax_reduction_non_dependant_weekly_deduction_by_band[arun_council_tax_reduction_non_dependant_deduction_band] * arun_council_tax_reduction_chargeable_non_dependant_count) * arun_council_tax_reduction_support_rate_by_income_band[arun_council_tax_reduction_income_band]"}]

