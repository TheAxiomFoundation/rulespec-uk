  class: definition
  note: 'Re-encode of the existing module, which encodes only the paras 9-10 amounts and takes claimant_responsible_child_or_qualifying_young_person_count
    as a supplied count. Keep the existing amount output names (child_or_qualifying_young_person_weekly_amount,
    first_child_or_qualifying_young_person_born_before_6_april_2017_weekly_amount, additional_amount_applicable,
    ...) so the companion test and consumers keep resolving. Required new outputs (Person / Family, Week):
    para 2(1) child = a person under the age of 16, computed from age; qualifying young person = the reg
    4A meaning, which is not in the pinned release: a scoped input deferred to uk/regulations/uksi/2002/1792/4A.yaml;
    para 3 responsibility (normally lives with the claimant; not for a QYP living as a couple with the
    claimant; only the person with main responsibility where the child lives with two or more persons
    who are not a couple); paras 4-5 treated as not responsible while looked after by a local authority
    (except the para 4(3) short breaks, placement with a parent, placement for adoption) or a prisoner;
    para 6 absence in Great Britain likely to exceed 52 weeks, except in exceptional circumstances (for
    example hospital) where the absence is unlikely to be substantially more than 52 weeks ("substantially"
    is undefined: take it as a scoped input finding, never a numeric tolerance); para 7 absence
    outside Great Britain longer than 4 weeks or expected to exceed 4 weeks (8 weeks, or expected to exceed
    8, for the 7(2) death cases; 26 weeks, or expected to exceed 26, for 7(3) treatment), so an expected
    duration over the limit ends responsibility before that many weeks have elapsed; para 8 treated as responsible
    for 8 weeks after a death (a QYP: until the date they would have attained 20, if earlier). Companion
    tests (2026-27, weekly): person aged 15 -> child holds; person aged 16 -> child not_holds; child aged
    10 normally living with the claimant -> responsible holds; QYP living as a couple with the claimant
    -> responsible not_holds; child looked after by a local authority, no para 4(3) case -> not_holds;
    same child on a planned respite short break -> holds; child abroad 5 weeks, no 7(2)/7(3) case -> not_holds;
    abroad 3 weeks, expected total 4 weeks -> holds; abroad 3 weeks so far, expected total 5 weeks -> not_holds;
    child in hospital in Great Britain, absence expected 54 weeks, exceptional circumstances, absence found
    unlikely to be substantially more than 52 weeks -> holds; same child, exceptional circumstances, absence
    likely to be substantially more than 52 weeks (expected 104 weeks) -> not_holds; child absent in Great
    Britain, expected 60 weeks, no exceptional circumstances -> not_holds; 7(3) treatment abroad, 10 weeks so
    far, expected total 30 weeks -> not_holds; responsible for two children, eldest born 2015 -> 81.07 + 69.98 = 151.05;
    two children, eldest born 2018 -> 139.96; one child born 2019 receiving DLA care below the highest
