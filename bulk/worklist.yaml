  batch: CTR-ENP
  status: done
  heading: 'Schedule 1 paragraph 4 - Class C: alternative maximum council tax reduction'
  class: definition
  note: Class definition parallel to already-encoded Class A (p2)/Class B (p3); conditions self-contained
    within the paragraph; external refs to the 1992 Act only.
