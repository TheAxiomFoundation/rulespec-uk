- citation: uk/statute/ukpga/2007/3/55B
  repo: rulespec-uk
  batch: PE-UK-CHILD-DEFS
  status: pending
  heading: Marriage Allowance tax reduction and transferable amount (ITA 2007 s55B)
  class: mechanics
  note: 'Re-encode: the existing transferable_amount rule is min(relinquishing_partner_unused_personal_allowance,
    statutory amount). The corpus text (release uk-rulespec-2026-09-07, statute/2026-07-10-uk-rulespec-source-promotion
    line 64) fixes the transferable amount in s55B(4)-(5) (1,060 for 2015-16; 10% of the s35(1) personal
    allowance, rounded up to a multiple of 10) and s55B(6) reduces the relinquishing spouse or civil partner''s
    allowance by that amount: there is no cap at unused allowance. The module also has no output for the
    s55B(1) reduction itself (the s55B(3) appropriate percentage, i.e. the basic, Scottish basic or Welsh
    basic rate, times the transferable amount). Required outputs: entitlement judgment (s55B(2)(a)-(d);
    the s55C election stays a scoped input until s55C is ingested), transferable_amount, marriage_allowance_tax_reduction,
    relinquishing_personal_allowance_reduction (s55B(6); nil in the s55B(7) death case). Companion tests
    (personal allowance 12,570, basic rate 0.20): 2026-27 conditions met -> transferable 1,260, reduction
    252, relinquishing allowance reduced by 1,260; same with relinquishing spouse''s unused allowance
    500 -> still 1,260 and 252 (the current module returns 500); gaining party liable at the higher rate
    -> 0; either party claims married couple''s allowance -> 0; 2015-16 -> 1,060 and 212. PE parity: policyengine-uk
    marriage_allowance also caps at partners_unused_personal_allowance, so both engines share this departure;
    the PE side is a separate follow-up.'
