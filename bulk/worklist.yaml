  status: pending
  heading: 'Housing Benefit applicable amounts: personal allowances by claimant age, child and young person
    amounts, and premiums (HB Regs 2006 Sch 3)'
  class: rate
  note: 'New module (no uk/regulations/uksi/2006/213/schedule/3.yaml on main); the corpus row is the whole
    Schedule (release uk-rulespec-2026-09-07, scope regulation/2026-07-10-uk-rulespec-source-promotion
    line 24, expression 2026-04-06). PE parity: policyengine-uk remove-is-child-flags keys these on the
    claimant and partner, not every adult. Required outputs (Family, weekly Money / Judgment): (1) para
    1 personal allowance: single claimant (a) main phase ESA 95.55, (b) aged not less than 25 95.55, (c)
    aged less than 25 75.65; lone parent (a) main phase ESA 95.55, (b) aged not less than 18 95.55, (c)
    aged less than 18 75.65; couple (a) claimant main phase ESA 150.15, (b) at least one member aged not
    less than 18 150.15, (c) both members aged less than 18 114.35. (2) para 2 child or young person amount
    87.88 each. (3) para 12 disability premium: (a) single claimant or lone parent under the qualifying
    age for state pension credit meeting para 13, 44.85; (b) claimant has a partner and the claimant (13(1)(a)
    or (b)) or the partner (13(1)(a)), each under that age, meets it, 64.00. Inputs are claimant age,
    partner age, single claimant / lone parent / couple status (the reg 2 definitions are not in the pinned
    release; scope them exactly as inputs), main phase ESA, and the para 13 benefits of the claimant and
    partner only. Companion tests (2026-27, weekly): single aged 24 -> 75.65; single aged 25 -> 95.55;
