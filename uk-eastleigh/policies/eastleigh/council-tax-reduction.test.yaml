# Taper-delta pair, clear of the capital limit, deduction bands, the zero floor and income
# equal to the applicable amount (the scheme prints no minimum award). Weekly applicable
# amount £140 and weekly income £147, then £154, annualised over 365 days: 7300, 7665, 8030.
# Daily deduction 2 6/7% x £7 = £0.20, so 0.20 x 365 = 73 a year; doubling weekly excess to
# £14 adds another 73. The change in support, 1727 - 1654 = 73, is 20% of the 365 increase
