format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-74
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths:
    #     - uk/statutes/ukpga/1992/14/13A
    #     - uk/regulations/uksi/2012/2885
    #     - uk/regulations/uksi/2012/2886
    #   rationale: Section 13A delegates the working-age scheme to Eastleigh Borough Council, so the adopted document is the operative legal source for the locally set working-age values.
  summary: |-
    Eastleigh's 2026-27 working-age award is 100 percent of eligible liability, capped at Band D and reduced by the published non-dependant daily deductions and a 20 percent weekly excess-income taper. Capital greater than £6,000 ends support; the adopted text prints no tariff-income rule. Applicable amounts, income/capital assessment, liability apportionment and the detailed protected-class classifiers are consumed as inputs. Pension-age provisions are outside this module.
  deferred_outputs:
    - output: uk-eastleigh:policies/eastleigh/council-tax-reduction/section-12#applicable_amount_for_year
      reason: The category-specific living allowances and premiums used to determine the applicable amount are outside this award-surface module.
    - output: uk-eastleigh:policies/eastleigh/council-tax-reduction/sections-15-to-56#assessed_income_and_capital_for_year
      reason: Income and capital attribution, disregards, valuation, and notional-capital rules are outside this award-surface module.
    - output: uk-eastleigh:policies/eastleigh/council-tax-reduction/section-57#maximum_eligible_liability_for_year
      reason: The award surface consumes the lower of eligible liability and Band D liability after discounts and joint-liability apportionment.
    - output: uk-eastleigh:policies/eastleigh/council-tax-reduction/section-58.3-to-58.9#non_dependant_deductions_for_year
      reason: This module encodes the printed individual deduction bands; couple selection, apportionment, and protected-class classification are supplied as household inputs.
rules:
  - name: eastleigh_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 57.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "shall be 100 per cent, of the amount A divided by B"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          1

  - name: eastleigh_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 33.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-54
              excerpt: "the prescribed amount is £6,000 and no support shall be granted when the applicant has an amount greater that this level"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6000

  - name: eastleigh_council_tax_reduction_taper_whole_percentage_points
    kind: parameter
    dtype: Number
    period: Year
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "shall be 2 6/7 per cent"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          2

  - name: eastleigh_council_tax_reduction_taper_fraction_numerator
    kind: parameter
    dtype: Number
    period: Year
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "shall be 2 6/7 per cent"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          6

  - name: eastleigh_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    period: Year
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 58.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "£12.00 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          7

  - name: eastleigh_council_tax_reduction_per_cent_unit
    kind: parameter
    dtype: Rate
    period: Year
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 57.1 percentage notation unit
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "100 per cent"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          0.01

  - name: eastleigh_council_tax_reduction_daily_taper_rate
    kind: parameter
    dtype: Rate
    period: Day
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "The prescribed daily percentage for the purpose of calculating support as a percentage of excess of income over the applicable amount, which is deducted from maximum council tax support, shall be 2 6/7 per cent."
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          (eastleigh_council_tax_reduction_taper_whole_percentage_points + eastleigh_council_tax_reduction_taper_fraction_numerator / eastleigh_council_tax_reduction_days_per_week) * eastleigh_council_tax_reduction_per_cent_unit

  - name: eastleigh_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 59.1, derived weekly from the printed daily rate
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "shall be 2 6/7 per cent"
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "£12.00 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          eastleigh_council_tax_reduction_daily_taper_rate * eastleigh_council_tax_reduction_days_per_week

  - name: eastleigh_council_tax_reduction_non_dependant_income_threshold_weekly
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 58.1(a)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "normal gross weekly income is not less than £189.00, £12.00 x 1/7"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          189

  - name: eastleigh_council_tax_reduction_non_dependant_weekly_deduction_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: eastleigh_council_tax_reduction_non_dependant_deduction_band
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 58.1
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "the non-dependant deductions in respect of a day referred to in section 57 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, where it is shown to the appropriate authority that his normal gross weekly income is not less than £189.00, £12.00 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £4.00 x 1/7."
              table:
                header: Non-dependant deductions
                row_key: deduction band
                column_key: weekly deduction
    versions:
      - effective_from: '2026-04-01'
        values:
          0: 0
          1: 4
          2: 12

  - name: eastleigh_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 1.6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-8
              excerpt: "The adopted scheme for working age applicants is a means test"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          local_authority_is_eastleigh and council_tax_reduction_household_in_england and not council_tax_reduction_household_has_pensioner

  - name: eastleigh_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 33.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-54
              excerpt: "no support shall be granted when the applicant has an amount greater that this level"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          eastleigh_council_tax_reduction_assessed_capital_for_year <= eastleigh_council_tax_reduction_capital_limit

  - name: eastleigh_council_tax_reduction_non_dependant_deduction_band
    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 sections 58.1 and 58.6
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "normal gross weekly income is not less than £189.00, £12.00 x 1/7"
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-73
              excerpt: "No deduction shall be made in respect of any non-dependants occupying an applicant’s dwelling if the applicant or his partner is"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if eastleigh_council_tax_reduction_non_dependant_deduction_applies and not eastleigh_council_tax_reduction_applicant_or_partner_is_protected_from_non_dependant_deductions: if eastleigh_council_tax_reduction_non_dependant_in_remunerative_work and eastleigh_council_tax_reduction_non_dependant_normal_gross_weekly_income >= eastleigh_council_tax_reduction_non_dependant_income_threshold_weekly: 2 else: 1 else: 0

  - name: eastleigh_council_tax_reduction_individual_non_dependant_weekly_deduction
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 58.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: parameter_table
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "the non-dependant deductions in respect of a day referred to in section 57 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, where it is shown to the appropriate authority that his normal gross weekly income is not less than £189.00, £12.00 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £4.00 x 1/7."
              table:
                header: Non-dependant deductions
                row_key: deduction band
                column_key: weekly deduction
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          eastleigh_council_tax_reduction_non_dependant_weekly_deduction_by_band[eastleigh_council_tax_reduction_non_dependant_deduction_band]

  - name: eastleigh_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "Where an applicant’s income exceeds their applicable amount"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, eastleigh_council_tax_reduction_assessed_income_for_year - eastleigh_council_tax_reduction_applicable_amount_for_year)

  - name: eastleigh_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 section 59.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "deducting their excess income multiplied by the taper from their maximum council tax support as defined within section 57 of this scheme"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          eastleigh_council_tax_reduction_excess_income_for_year * eastleigh_council_tax_reduction_weekly_taper_rate

  - name: eastleigh_council_tax_reduction_maximum_after_non_dependant_deductions_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 sections 57.1 and 58.1
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "shall be 100 per cent, of the amount A divided by B"
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-72
              excerpt: "less any deductions in respect of non-dependants which fall to be made under section 58"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          max(0, eastleigh_council_tax_reduction_maximum_eligible_liability_for_year * eastleigh_council_tax_reduction_maximum_support_rate - eastleigh_council_tax_reduction_non_dependant_deductions_for_year)

  - name: eastleigh_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Eastleigh Borough Council Council Tax Reduction Scheme 2026/27 working-age award surface
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-eastleigh/manual/council-tax-reduction-scheme-2026-2027/page-74
              excerpt: "their council tax support shall be calculated by deducting their excess income multiplied by the taper from their maximum council tax support as defined within section 57 of this scheme"
    versions:
      - effective_from: '2026-04-01'
        formula: |-
          if eastleigh_council_tax_reduction_working_age_scheme_applies and would_claim_council_tax_reduction and eastleigh_council_tax_reduction_capital_eligible: max(0, eastleigh_council_tax_reduction_maximum_after_non_dependant_deductions_for_year - eastleigh_council_tax_reduction_income_taper_deduction_for_year) else: 0
