format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-burnley/manual/council-tax-reduction-scheme-2026-2027/page-74
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: LGFA 1992 section 13A delegates the working-age scheme to Burnley Borough Council, so the adopted scheme document is the operative legal source for locally set working-age values.
  summary: |-
    Burnley's 2026/27 working-age award (Classes D and E) is the daily maximum council tax reduction of section 57.1 (100 percent of the daily liability, less non-dependant deductions), less the section 59.1 excess-income taper for Class E, then reduced by the section 59A.1 15 percent standard deduction. Class E's amount B is "2 6/7 per cent of the difference between his income for the relevant week and his applicable amount", set against amount A, "the maximum Council Tax Reduction in respect of the day". Because the weekly excess is seven times the daily excess, this module multiplies the printed daily percentage by the seven-day conversion and applies the resulting 20 percent same-period rate to the daily excess. Class D requires income less than the applicable amount, or that the applicant or partner is in receipt of income support, income-based jobseeker's allowance or income-related employment and support allowance; Class E requires income more than the applicable amount and amount A exceeding amount B, and the section 59 heading applies the taper to persons defined within Class E. Where both class conditions hold (an applicant or partner in receipt of one of those benefits, with income above the applicable amount), this module awards the untapered Class D amount, the greater of the two, because the scheme gives "the amount of the reduction given by Class D or Class E as the case may be" without an order. For an applicant without one of those benefits, the scheme assigns neither class when income equals the applicable amount, so this module preserves that drafting gap. Capital over £16,000 is an exclusion, and £1 weekly tariff income applies for each complete or part £250 above £6,000. The scheme prints no minimum award and no council-tax-band cap. Paragraph 58.2 as printed applies its income bands to "a non-dependant aged 18 or over" and omits the qualifier "to whom sub-paragraph (1)(a) applies" that Schedule 1 paragraph 8(2) of the Prescribed Requirements Regulations 2012 attaches to the same printed bands and amounts, the regulations footnote 25 says this section's amounts are uprated in line with. This module applies the 58.2 bands only to non-dependants in remunerative work, as the prescribed paragraph does; the literal reading, under which the bands also reach non-dependants not in remunerative work, remains an open interpretation. Class F (second adult reduction), the greater-of selection between Classes D/E and F, Classes G and H, and pension-age provisions are outside this module.
  deferred_outputs:
    - output: uk-burnley:policies/burnley/council-tax-reduction/sections-12-to-14-and-schedule-1#applicable_amount
      reason: This module consumes the applicable amount; its household-category and premium schedules are outside the working-age award surface.
    - output: uk-burnley:policies/burnley/council-tax-reduction/sections-15-to-56-and-schedules-3-to-5#assessed_income_and_capital
      reason: This module consumes assessed income and capital; valuation, attribution, disregards and income classifiers are outside this award surface.
    - output: uk-burnley:policies/burnley/council-tax-reduction/section-58#non_dependant_exemptions_and_aggregation
      reason: This module encodes the printed individual weekly deduction bands and consumes the household daily deduction total; the 58.1 "x 1/7" daily conversion of the weekly amounts, exemptions, couples and apportionment remain future outputs.
    - output: uk-burnley:policies/burnley/council-tax-reduction/sections-62-63-and-schedule-2#class_f_second_adult_reduction
      reason: Class F's alternative maximum council tax reduction and the greater-of selection between the Class D or E amount and the Class F amount are outside this Class D and E award surface.
    - output: uk-burnley:policies/burnley/council-tax-reduction/schedules-6-and-7#class_g_and_h_reduction
      reason: Class G (terminal illness) and Class H (care leavers) reductions are determined under Appendices 6 and 7 and are outside this Class D and E award surface.
