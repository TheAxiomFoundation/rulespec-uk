    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-burnley/manual/council-tax-reduction-scheme-2026-2027/page-76, excerpt: "shall be 2 6/7 per cent."}}]}}
    versions: [{effective_from: '2026-04-01', formula: '7'}]

  - name: burnley_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    period: Year
    source: Burnley Council Tax Reduction Scheme 2026 section 2 definition of week and section 58.1
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-burnley/manual/council-tax-reduction-scheme-2026-2027/page-74, excerpt: "£15.95 x 1/7"}}, {path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-burnley/manual/council-tax-reduction-scheme-2026-2027/page-22, excerpt: "‘week’ means a period of seven days beginning with a Monday;"}}]}}
