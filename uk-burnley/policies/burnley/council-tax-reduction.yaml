  - name: burnley_council_tax_reduction_prescribed_daily_percentage
    kind: parameter
    dtype: Rate
    period: Day
    source: Burnley Council Tax Reduction Scheme 2026 section 59.1, derived from the printed mixed-number percentage; applies to the weekly excess
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-burnley/manual/council-tax-reduction-scheme-2026-2027/page-76, excerpt: "The prescribed daily percentage for the purpose of calculating reduction as a percentage of excess of income over the applicable amount, which is deducted from maximum council tax reduction, shall be 2 6/7 per cent."}}, {path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-burnley/manual/council-tax-reduction-scheme-2026-2027/page-10, excerpt: "(ii) amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount."}}]}}
    versions: [{effective_from: '2026-04-01', formula: '(burnley_council_tax_reduction_taper_whole_percentage_points + burnley_council_tax_reduction_taper_fraction_numerator / burnley_council_tax_reduction_taper_fraction_denominator) * burnley_council_tax_reduction_per_cent_unit'}]

  - name: burnley_council_tax_reduction_same_period_taper_rate
    kind: parameter
    dtype: Rate
    period: Day
    source: Burnley Council Tax Reduction Scheme 2026 Class E and section 59.1; the prescribed daily percentage of the weekly excess multiplied by the seven-day conversion, giving the rate on the same-period (daily) excess. The seven-day multiplication is applied to the printed mixed number's parts before the fraction's division, so the result is the exact decimal 0.2
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-burnley/manual/council-tax-reduction-scheme-2026-2027/page-10, excerpt: "(i) amount A is the maximum Council Tax Reduction in respect of the day in the applicant’s case; and"}}, {path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-burnley/manual/council-tax-reduction-scheme-2026-2027/page-10, excerpt: "(ii) amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount."}}, {path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-burnley/manual/council-tax-reduction-scheme-2026-2027/page-74, excerpt: "£15.95 x 1/7"}}, {path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-burnley/manual/council-tax-reduction-scheme-2026-2027/page-22, excerpt: "‘week’ means a period of seven days beginning with a Monday;"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '(burnley_council_tax_reduction_taper_whole_percentage_points * burnley_council_tax_reduction_days_per_week + burnley_council_tax_reduction_taper_fraction_numerator * burnley_council_tax_reduction_days_per_week / burnley_council_tax_reduction_taper_fraction_denominator) * burnley_council_tax_reduction_per_cent_unit'}]

