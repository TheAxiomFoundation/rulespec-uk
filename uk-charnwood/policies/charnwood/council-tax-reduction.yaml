format: rulespec/v1
module:
  proof_validation: {required: true}
  source_verification:
    corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-46
    # upstream_source_check:
    #   status: delegated_scheme
    #   checked_paths: [uk/statutes/ukpga/1992/14/13A, uk/regulations/uksi/2012/2885, uk/regulations/uksi/2012/2886]
    #   rationale: Section 13A of the Local Government Finance Act 1992 delegates the working-age scheme to Charnwood Borough Council, so its adopted scheme document is the operative legal source for the locally set working-age values.
  summary: >-
    Working-age Classes D and E only. The Local Council Tax Support Scheme 2026
    relates to the financial year beginning with 1st April 2026. The maximum is
    the daily liability at the paragraph 29 percentage less non-dependant
    deductions, floored at zero; Class D receives it and Class E receives it
    less amount B. Paragraph 29(1) prints 100 per cent, and paragraph 29(1A)
    says that for a person who is not a pensioner (1) has effect as if "100 per
    cent" were substituted for "85 per cent". Sub-paragraph (1) contains no "85
    per cent", so the literal text leaves 100 per cent, which this module
    encodes; reading (1A) as intended to change the rate gives 85 per cent. That
    conflict is recorded here and awaits a campaign ruling. Amount B is 2 6/7 per
    cent of the excess of income for the relevant week over the applicable
    amount, deducted from the maximum in respect of a day, so the same-period
    taper is 20 per cent of weekly excess per week; this module applies 20 per
    cent to excess and maximum over the same year. Weekly amounts such as tariff
    income are annualised over 52 weeks, while the maximum covers every day of
    the financial year, so a full year's taper is 52 weeks' rather than 365/7
    weeks' deduction. Class D needs income less than the applicable amount and
    Class E income greater than it; the scheme assigns no class at equality, and
    this module keeps that gap. Non-dependant deductions follow paragraph 30(1)
    and (2) literally, including the printed penny gaps between bands, and a
    non-dependant for whom no deduction is made selects a zero band.
    Pension-age provisions, applicable-amount schedules, income assessment,
    capital valuation and non-dependant exemptions or household aggregation are
    outside this award-surface module.
  deferred_outputs:
    - output: uk-charnwood:policies/charnwood/council-tax-reduction/part-6-and-schedules-2-and-3#applicable_amount
      reason: Category-specific personal allowances and premiums determine applicable amount and are outside this award-surface module.
    - output: uk-charnwood:policies/charnwood/council-tax-reduction/part-10-and-schedule-10#assessed_income_and_capital
      reason: Income assessment, capital valuation, attribution and disregards are outside this award-surface module.
    - output: uk-charnwood:policies/charnwood/council-tax-reduction/paragraph-30-subparagraphs-3-to-10#non_dependant_exemption_and_household_aggregation
      reason: This module provides every individual deduction band but defers the paragraph 30(3) to (10) couple, apportionment, exemption, income-disregard and household aggregation classifiers.
rules:
  - name: charnwood_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 29(1) and (1A)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: a person's maximum council tax support amount in respect of a day is 100 per cent of the amount A/B
          - path: versions[0].formula
            kind: amount
            source:
              corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: '(1A) In relation to a person who is not a pensioner, sub-paragraph (1) above shall have effect as if the words "100 per cent" were substituted for the words "85 per cent"'
    versions:
      - effective_from: '2026-04-01'
        # Sub-paragraph (1) prints 100 per cent. Sub-paragraph (1A) substitutes
        # "100 per cent" for "85 per cent" for persons who are not pensioners,
        # but (1) contains no "85 per cent", so read literally (1A) changes
        # nothing and the working-age maximum stays 100 per cent. Read as
        # intending a change, (1A) would make it 85 per cent. Which reading
        # controls is awaiting a campaign ruling; see the module summary.
        formula: '1'
  - name: charnwood_council_tax_reduction_taper_whole_percentage_points
    kind: parameter
    dtype: Number
    period: Year
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 17(f)(ii)
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-28, excerpt: 'amount B is 2 6/7 per cent'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '2'}]
  - name: charnwood_council_tax_reduction_taper_fraction_numerator
    kind: parameter
    dtype: Number
    period: Year
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 17(f)(ii)
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-28, excerpt: 'amount B is 2 6/7 per cent'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '6'}]
  - name: charnwood_council_tax_reduction_taper_fraction_denominator
    kind: parameter
    dtype: Number
    period: Year
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 17(f)(ii)
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-28, excerpt: 'amount B is 2 6/7 per cent'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '7'}]
  - name: charnwood_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    period: Year
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 30
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-41, excerpt: '£15.95 x 1/7'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '7'}]
  - name: charnwood_council_tax_reduction_per_cent_unit
    kind: parameter
    dtype: Rate
    period: Year
    source: Charnwood Local Council Tax Support Scheme 2026 percentage notation
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-40, excerpt: '100 per cent'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '0.01'}]
  - name: charnwood_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: Charnwood Local Council Tax Support Scheme 2026 paragraphs 17(f)(ii) and 29(1), weekly rate derived from the printed daily mixed-number percentage
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-28
              excerpt: amount B is 2 6/7 per cent of the difference between his income for the relevant week and his applicable amount
          - path: versions[0].formula
            kind: formula
            source:
              corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-40
              excerpt: a person's maximum council tax support amount in respect of a day is 100 per cent of the amount A/B
          - path: versions[0].formula
            kind: definition
            source:
              corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-15
              excerpt: "“Relevant week”, in relation to any particular day, means the week within which the day in question falls"
    versions:
      - effective_from: '2026-04-01'
        # Amount B is deducted from the maximum for a day but measures a week's
        # excess, so it is (2 + 6/7) per cent of weekly excess per day, and seven
        # days a week make 20 per cent of weekly excess per week. Write 2 6/7 as
        # (2 * 7 + 6) / 7 and multiply by the days before dividing, so the rate
        # stays exact.
        formula: (charnwood_council_tax_reduction_taper_whole_percentage_points * charnwood_council_tax_reduction_taper_fraction_denominator + charnwood_council_tax_reduction_taper_fraction_numerator) * charnwood_council_tax_reduction_days_per_week / charnwood_council_tax_reduction_taper_fraction_denominator * charnwood_council_tax_reduction_per_cent_unit
  - name: charnwood_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 23
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-37, excerpt: 'capital exceeds £16,000'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '16000'}]
  - name: charnwood_council_tax_reduction_tariff_income_threshold
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 72
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-94, excerpt: '£1 for each £250 in excess of £6,000 but not exceeding £16,000'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '6000'}]
  - name: charnwood_council_tax_reduction_tariff_income_step
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 72
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-94, excerpt: '£1 for each £250 in excess of £6,000 but not exceeding £16,000'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '250'}]
  - name: charnwood_council_tax_reduction_tariff_income_weekly_amount_per_step
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 72
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-94, excerpt: '£1 for each £250 in excess of £6,000 but not exceeding £16,000'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '1'}]
  - name: charnwood_council_tax_reduction_weeks_per_year
    kind: parameter
    dtype: Number
    period: Year
    # Paragraph 28(3) converts a monthly universal credit amount to weekly by
    # treating 12 months as 52 weeks. The scheme prints no other weeks-in-a-year
    # figure, so this module borrows that 52-week year as its own convention for
    # annualising weekly amounts such as tariff income.
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 28(3) 52-week year adopted as the module's annualisation convention
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-40, excerpt: 'multiply the maximum amount by 12 and divide the product by 52'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '52'}]
  - name: charnwood_council_tax_reduction_non_dependant_deduction_weekly_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: charnwood_council_tax_reduction_non_dependant_deduction_band
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 30(1), (2) and (6) to (8)
    metadata:
      proof:
        atoms:
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-41
              excerpt: "in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7. (b) in respect of a non-dependant aged 18 or over to whom paragraph (a) does not apply, £5.20 x 1/7.\n\n(2) In the case of a non-dependant aged 18 or over to whom sub-paragraph (1)(a) applies, where it is shown to the appropriate authority that his normal gross weekly income is— (a) less than £278.99, the deduction to be made under this paragraph is that specified in sub-paragraph (1)(b). (b) not less than £279.00 but less than £484.99, the deduction to be made under this paragraph is £10.60 x1/7. (c) not less than £485.00 but less than £604.99, the deduction to be made under this paragraph is £13.30 x1/7."
              table: {header: Working-age non-dependant deductions, row_key: deduction band 1 to 4, column_key: weekly deduction before multiplication by 1/7}
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-41
              excerpt: (6) No deduction is to be made in respect of any non-dependants occupying an
              table: {header: Working-age non-dependant deductions, row_key: deduction band 0 (no deduction), column_key: weekly deduction before multiplication by 1/7}
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-42
              excerpt: (7) No deduction is to be made in respect of a non-dependant if
              table: {header: Working-age non-dependant deductions, row_key: deduction band 0 (no deduction), column_key: weekly deduction before multiplication by 1/7}
          - path: versions[0].values
            kind: parameter_table
            source:
              corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-43
              excerpt: (8) No deduction is to be made in respect of a non-dependant—
              table: {header: Working-age non-dependant deductions, row_key: deduction band 0 (no deduction), column_key: weekly deduction before multiplication by 1/7}
    # Band 0 is the no-deduction case of paragraph 30(6) to (8); bands 1 to 4
    # are the printed paragraph 30(1)(b), (2)(b), (2)(c) and (1)(a) amounts.
    versions: [{effective_from: '2026-04-01', values: {0: 0, 1: 5.20, 2: 10.60, 3: 13.30, 4: 15.95}}]
  - name: charnwood_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Charnwood Local Council Tax Support Scheme 2026 Classes D and E
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-28, excerpt: 'persons who are not pensioners'}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'local_authority_is_charnwood and council_tax_reduction_household_in_england and charnwood_council_tax_reduction_applicant_is_not_pensioner'}]
  - name: charnwood_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 23
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: condition, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-37, excerpt: 'capital exceeds £16,000'}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'charnwood_council_tax_reduction_assessed_capital_for_year <= charnwood_council_tax_reduction_capital_limit'}]
  - name: charnwood_council_tax_reduction_tariff_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 72
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-94, excerpt: '£1 for any excess which is not a complete £250'}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'if charnwood_council_tax_reduction_assessed_capital_for_year > charnwood_council_tax_reduction_tariff_income_threshold: ceil((charnwood_council_tax_reduction_assessed_capital_for_year - charnwood_council_tax_reduction_tariff_income_threshold) / charnwood_council_tax_reduction_tariff_income_step) * charnwood_council_tax_reduction_tariff_income_weekly_amount_per_step * charnwood_council_tax_reduction_weeks_per_year else: 0'}]
  - name: charnwood_council_tax_reduction_non_dependant_deduction_band
    kind: derived
    entity: Person
    dtype: Integer
    period: Week
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 30(1), (2) and (6) to (8)
    metadata:
      proof:
        atoms:
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-41
              excerpt: "(a) less than £278.99, the deduction to be made under this paragraph is that specified in sub-paragraph (1)(b). (b) not less than £279.00 but less than £484.99, the deduction to be made under this paragraph is £10.60 x1/7. (c) not less than £485.00 but less than £604.99, the deduction to be made under this paragraph is £13.30 x1/7."
          - path: versions[0].formula
            kind: condition
            source:
              corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-41
              excerpt: in respect of a non-dependant aged 18 or over in remunerative work, £15.95 x 1/7. (b) in respect of a non-dependant aged 18 or over to whom paragraph (a) does not apply, £5.20 x 1/7.
          - path: versions[0].formula
            kind: exception
            source:
              corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-42
              excerpt: (7) No deduction is to be made in respect of a non-dependant if
    versions:
      - effective_from: '2026-04-01'
        # Paragraph 30(2) prints "less than £278.99", then "not less than £279.00
        # but less than £484.99", then "not less than £485.00 but less than
        # £604.99". An income of exactly £278.99 or £484.99, or of £604.99 or
        # more, meets none of those heads, so the paragraph 30(1)(a) amount
        # (band 4) applies. Band 0 is no deduction under paragraph 30(6) to (8).
        formula: 'if charnwood_council_tax_reduction_non_dependant_deduction_applies: if charnwood_council_tax_reduction_non_dependant_in_remunerative_work: if charnwood_council_tax_reduction_non_dependant_normal_gross_weekly_income < charnwood_council_tax_reduction_non_dependant_low_income_threshold: 1 else: if charnwood_council_tax_reduction_non_dependant_normal_gross_weekly_income >= charnwood_council_tax_reduction_non_dependant_middle_band_lower_threshold and charnwood_council_tax_reduction_non_dependant_normal_gross_weekly_income < charnwood_council_tax_reduction_non_dependant_middle_income_threshold: 2 else: if charnwood_council_tax_reduction_non_dependant_normal_gross_weekly_income >= charnwood_council_tax_reduction_non_dependant_high_band_lower_threshold and charnwood_council_tax_reduction_non_dependant_normal_gross_weekly_income < charnwood_council_tax_reduction_non_dependant_top_income_threshold: 3 else: 4 else: 1 else: 0'
  - name: charnwood_council_tax_reduction_non_dependant_low_income_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 30(2)(a)
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-41, excerpt: 'less than £278.99'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '278.99'}]
  - name: charnwood_council_tax_reduction_non_dependant_middle_income_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 30(2)(b)
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-41, excerpt: 'not less than £279.00 but less than £484.99'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '484.99'}]
  - name: charnwood_council_tax_reduction_non_dependant_top_income_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 30(2)(c)
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-41, excerpt: 'not less than £485.00 but less than £604.99'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '604.99'}]
  - name: charnwood_council_tax_reduction_non_dependant_middle_band_lower_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 30(2)(b)
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-41, excerpt: 'not less than £279.00 but less than £484.99'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '279.00'}]
  - name: charnwood_council_tax_reduction_non_dependant_high_band_lower_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 30(2)(c)
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: amount, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-41, excerpt: 'not less than £485.00 but less than £604.99'}}]}}
    versions: [{effective_from: '2026-04-01', formula: '485.00'}]
  - name: charnwood_council_tax_reduction_individual_non_dependant_deduction_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 30
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-41, excerpt: 'the non-dependant deductions in respect of a day referred to in paragraph 29 are'}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'charnwood_council_tax_reduction_non_dependant_deduction_weekly_by_band[charnwood_council_tax_reduction_non_dependant_deduction_band]'}]
  - name: charnwood_council_tax_reduction_maximum_council_tax_reduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Charnwood Local Council Tax Support Scheme 2026 paragraph 29
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-40, excerpt: 'a person''s maximum council tax support amount in respect of a day is 100 per cent of the amount A/B'}}, {path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-40, excerpt: 'less any deductions in respect of non-dependants which fall to be made under paragraph 30'}}]}}
    versions:
      - effective_from: '2026-04-01'
        # Non-dependant deductions can exceed the liability for a day. Support
        # reduces the council tax payable and cannot add to it, so the maximum
        # is floored at zero before Classes D and E use it.
        formula: 'max(charnwood_council_tax_reduction_actual_liability_for_year * charnwood_council_tax_reduction_maximum_support_rate - charnwood_council_tax_reduction_non_dependant_deductions_for_year, 0)'
  - name: charnwood_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Charnwood Local Council Tax Support Scheme 2026 Class E
    metadata: {proof: {atoms: [{path: 'versions[0].formula', kind: formula, source: {corpus_citation_path: uk-charnwood/manual/council-tax-reduction-scheme-2026-2027/page-28, excerpt: 'difference between his income for the relevant week and his applicable amount'}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'max(charnwood_council_tax_reduction_assessed_income_for_year + charnwood_council_tax_reduction_tariff_income_for_year - charnwood_council_tax_reduction_applicable_amount_for_year, 0)'}]
  - name: charnwood_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
