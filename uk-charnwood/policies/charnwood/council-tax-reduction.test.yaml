# Taper periodisation, clear of the capital cliff (capital 0, no tariff income),
# the Class E exhaustion edge and any floor. Income £150 a week (7800 a year) over
# an applicable amount of £100 a week (5200) is a weekly excess of £50 (2600 a year).
# Amount B is 2 6/7 per cent of £50 = £1.428571 a day against the daily maximum,
# x 7 = £10 a week = 20 per cent of £50. Over 52 weeks: 0.20 x 2600 = 520, and
# support is 2600 - 520 = 2080 (£50 - £10 = £40 a week x 52).
- name: charnwood_ctr_taper_weekly_excess_50
  period: {period_kind: tax_year, start: '2026-04-01', end: '2027-03-31'}
  input:
    uk-charnwood:policies/charnwood/council-tax-reduction#input.local_authority_is_charnwood: true
    uk-charnwood:policies/charnwood/council-tax-reduction#input.council_tax_reduction_household_in_england: true
    uk-charnwood:policies/charnwood/council-tax-reduction#input.charnwood_council_tax_reduction_applicant_is_not_pensioner: true
