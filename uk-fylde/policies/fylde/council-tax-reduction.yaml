format: rulespec/v1
module:
  proof_validation:
    required: true
  source_verification:
    corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-73
    # upstream_source_check:
      # status: delegated_scheme
      # checked_paths:
        # - uk/statutes/ukpga/1992/14/13A
        # - uk/regulations/uksi/2012/2885
        # - uk/regulations/uksi/2012/2886
      # rationale: Section 13A of the Local Government Finance Act 1992 delegates the working-age scheme to Fylde Council, so its adopted scheme document is the operative legal source for the locally set working-age values.
  summary: Fylde's 2026-27 working-age local scheme is a means test. The award is the 100 percent maximum liability less non-dependant deductions and the weekly equivalent of the printed daily excess-income taper, then reduced by the printed 22.7 percent standard deduction. The working-age class includes a pension-credit-age applicant or partner receiving a specified qualifying benefit; other pension-age provisions are outside this module.
  deferred_outputs:
    - output: uk-fylde:policies/fylde/council-tax-reduction/schedule-1#applicable_amount
      reason: Schedule 1's category-specific applicable amounts and premiums supply the means-test comparator but are outside this award-surface module.
    - output: uk-fylde:policies/fylde/council-tax-reduction/sections-15-to-56#assessed_income_and_capital
      reason: Detailed income, capital valuation, attribution and disregard rules are outside this award-surface module.
    - output: uk-fylde:policies/fylde/council-tax-reduction/section-58#non_dependant_exemption_and_aggregation
      reason: This module encodes every printed individual deduction band and consumes the household total; exemptions, couple aggregation and apportionment remain future outputs.
rules:
  - name: fylde_council_tax_reduction_maximum_support_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Fylde Council Tax Reduction Scheme 2026-27 section 57.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "shall be 100 per cent, of the amount A/B"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '1'}]
  - name: fylde_council_tax_reduction_per_cent_unit
    kind: parameter
    dtype: Rate
    period: Year
    source: Fylde Council Tax Reduction Scheme 2026-27 percentage notation
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "100 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '0.01'}]
  - name: fylde_council_tax_reduction_standard_deduction_rate
    kind: parameter
    dtype: Rate
    period: Year
    source: Fylde Council Tax Reduction Scheme 2026-27 Schedule 6 derived percentage rate
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-139, excerpt: "a percentage reduction of 22.7% will be made"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '0.227'}]
  - name: fylde_council_tax_reduction_taper_whole_percentage_points
    kind: parameter
    dtype: Number
    period: Year
    source: Fylde Council Tax Reduction Scheme 2026-27 section 59.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '2'}]
  - name: fylde_council_tax_reduction_taper_fraction_numerator
    kind: parameter
    dtype: Number
    period: Year
    source: Fylde Council Tax Reduction Scheme 2026-27 section 59.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '6'}]
  - name: fylde_council_tax_reduction_days_per_week
    kind: parameter
    dtype: Number
    period: Year
    source: Fylde Council Tax Reduction Scheme 2026-27 section 58.1 daily conversion
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "£15.35 x 1/7"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '7'}]
  - name: fylde_council_tax_reduction_daily_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: Fylde Council Tax Reduction Scheme 2026-27 section 59.1 daily mixed-number percentage
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "2 6/7 per cent"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '(fylde_council_tax_reduction_taper_whole_percentage_points + fylde_council_tax_reduction_taper_fraction_numerator / fylde_council_tax_reduction_days_per_week) * fylde_council_tax_reduction_per_cent_unit'}]
  - name: fylde_council_tax_reduction_weekly_taper_rate
    kind: parameter
    dtype: Rate
    period: Week
    source: Fylde Council Tax Reduction Scheme 2026-27 section 59.1 weekly equivalent of daily rate
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "The prescribed daily percentage for the purpose of calculating support as a percentage of excess of income over the applicable amount which is deducted from maximum council tax support, shall be 2 6/7 per cent."}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'fylde_council_tax_reduction_daily_taper_rate * fylde_council_tax_reduction_days_per_week'}]
  - name: fylde_council_tax_reduction_capital_limit
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 section 33.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-53, excerpt: "the prescribed amount is £16,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '16000'}]
  - name: fylde_council_tax_reduction_tariff_income_threshold
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 section 42.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-58, excerpt: "exceeds £6,000"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '6000'}]
  - name: fylde_council_tax_reduction_tariff_income_step
    kind: parameter
    dtype: Money
    period: Year
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 section 42.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-58, excerpt: "each complete £250"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '250'}]
  - name: fylde_council_tax_reduction_tariff_income_weekly_amount_per_step
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 section 42.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-58, excerpt: "weekly income of £1 for each complete £250"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '1'}]
  - name: fylde_council_tax_reduction_weeks_per_year
    kind: parameter
    dtype: Number
    period: Year
    source: Fylde Council Tax Reduction Scheme 2026-27 weekly annualisation
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-42, excerpt: "multiplying the amount of the payment by 12 and dividing the product by 52"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '52'}]
  - name: fylde_council_tax_reduction_non_dependant_deduction_weekly_by_band
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    indexed_by: fylde_council_tax_reduction_non_dependant_band
    source: Fylde Council Tax Reduction Scheme 2026-27 section 58.1-58.2
    metadata: {proof: {atoms: [{path: "versions[0].values", kind: parameter_table, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "58.1 Subject to the following provisions of this paragraph, the non-dependant deductions in respect of a day referred to in section 57 (maximum council tax reduction) shall be; (a) in respect of a non-dependant aged 18 or over in remunerative work, £15.35 x 1/7; (b) in respect of a non-dependant aged 18 or over to whom sub-paragraph (a) does not apply, £5.00 x 1/7.\n\n58.2 In the case of a non-dependant aged 18 or over to whom paragraph 58.1(a) applies, where it is shown to the appropriate authority that his normal gross weekly income is– (a) less than £266.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £266.00, but less than £463.00, the deduction to be made under this section shall be £10.20 x1/7 (c) not less than £463.00, but less than £577.00, the deduction to be made under this section shall be £12.80 x 1/7;"}}]}}
    versions: [{effective_from: '2026-04-01', values: {0: 5.00, 1: 10.20, 2: 12.80, 3: 15.35}}]
  - name: fylde_council_tax_reduction_non_dependant_low_income_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 section 58.2(a)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "less than £266.00"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '266.00'}]
  - name: fylde_council_tax_reduction_non_dependant_middle_income_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 section 58.2(b)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "less than £463.00"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '463.00'}]
  - name: fylde_council_tax_reduction_non_dependant_top_income_threshold
    kind: parameter
    dtype: Money
    period: Week
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 section 58.2(c)
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: amount, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "less than £577.00"}}]}}
    versions: [{effective_from: '2026-04-01', formula: '577.00'}]
  - name: fylde_council_tax_reduction_working_age_scheme_applies
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Fylde Council Tax Reduction Scheme 2026-27 section 1.6
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-8, excerpt: "this scheme only applies to a person who; a. has not attained the qualifying age for state pension credit; or b. has attained the qualifying age for state pension credit if he, and his partner, is a person on income support, on an income-based jobseeker’s allowance, on an income-related employment and support allowance or on universal credit."}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'local_authority_is_fylde and council_tax_reduction_household_in_england and (fylde_council_tax_reduction_applicant_is_not_pensioner or fylde_council_tax_reduction_applicant_or_partner_receives_income_support or fylde_council_tax_reduction_applicant_or_partner_receives_income_based_jobseekers_allowance or fylde_council_tax_reduction_applicant_or_partner_receives_income_related_employment_and_support_allowance or fylde_council_tax_reduction_applicant_or_partner_receives_universal_credit)'}]
  - name: fylde_council_tax_reduction_capital_eligible
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Fylde Council Tax Reduction Scheme 2026-27 section 33.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-53, excerpt: "no entitlement to support if capital exceeds prescribed amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'fylde_council_tax_reduction_assessed_capital_for_year <= fylde_council_tax_reduction_capital_limit'}]
  - name: fylde_council_tax_reduction_tariff_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 section 42
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-58, excerpt: "any part of the excess is not a complete £250 that part shall be treated as equivalent to a weekly tariff income of £1"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'if fylde_council_tax_reduction_assessed_capital_for_year > fylde_council_tax_reduction_tariff_income_threshold: ceil((fylde_council_tax_reduction_assessed_capital_for_year - fylde_council_tax_reduction_tariff_income_threshold) / fylde_council_tax_reduction_tariff_income_step) * fylde_council_tax_reduction_tariff_income_weekly_amount_per_step * fylde_council_tax_reduction_weeks_per_year else: fylde_council_tax_reduction_capital_limit - fylde_council_tax_reduction_capital_limit'}]
  - name: fylde_council_tax_reduction_non_dependant_band
    kind: derived
    entity: Person
    dtype: Number
    period: Week
    source: Fylde Council Tax Reduction Scheme 2026-27 section 58.1-58.2
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: parameter_table, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "(a) less than £266.00, the deduction to be made under this paragraph shall be that specified in paragraph 58.1(b); (b) not less than £266.00, but less than £463.00, the deduction to be made under this section shall be £10.20 x1/7 (c) not less than £463.00, but less than £577.00, the deduction to be made under this section shall be £12.80 x 1/7;"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'if fylde_council_tax_reduction_non_dependant_in_remunerative_work: if fylde_council_tax_reduction_non_dependant_normal_gross_weekly_income < fylde_council_tax_reduction_non_dependant_low_income_threshold: 0 else: if fylde_council_tax_reduction_non_dependant_normal_gross_weekly_income < fylde_council_tax_reduction_non_dependant_middle_income_threshold: 1 else: if fylde_council_tax_reduction_non_dependant_normal_gross_weekly_income < fylde_council_tax_reduction_non_dependant_top_income_threshold: 2 else: 3 else: 0'}]
  - name: fylde_council_tax_reduction_individual_non_dependant_deduction_weekly
    kind: derived
    entity: Person
    dtype: Money
    period: Week
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 section 58
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-72, excerpt: "No deduction shall be made in respect of any non-dependants"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'if fylde_council_tax_reduction_non_dependant_deduction_applies: fylde_council_tax_reduction_non_dependant_deduction_weekly_by_band[fylde_council_tax_reduction_non_dependant_band] else: fylde_council_tax_reduction_capital_limit - fylde_council_tax_reduction_capital_limit'}]
  - name: fylde_council_tax_reduction_maximum_amount_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 section 57.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-71, excerpt: "the amount of a person’s maximum council tax support"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'fylde_council_tax_reduction_actual_liability_for_year * fylde_council_tax_reduction_maximum_support_rate - fylde_council_tax_reduction_non_dependant_deductions_for_year'}]
  - name: fylde_council_tax_reduction_excess_income_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 section 59.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "Where a claimant’s income exceeds their applicable amount"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'max(fylde_council_tax_reduction_assessed_income_for_year + fylde_council_tax_reduction_tariff_income_for_year - fylde_council_tax_reduction_applicable_amount_for_year, fylde_council_tax_reduction_capital_limit - fylde_council_tax_reduction_capital_limit)'}]
  - name: fylde_council_tax_reduction_income_taper_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 section 59.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "deducting their excess income multiplied by the taper from their maximum council tax support"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'fylde_council_tax_reduction_excess_income_for_year * fylde_council_tax_reduction_weekly_taper_rate'}]
  - name: fylde_council_tax_reduction_award_before_standard_deduction_for_year
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 sections 57 and 59
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "deducting their excess income multiplied by the taper from their maximum council tax support"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'max(0, fylde_council_tax_reduction_maximum_amount_for_year - fylde_council_tax_reduction_income_taper_deduction_for_year)'}]
  - name: fylde_council_tax_reduction_award_conditions_met
    kind: derived
    entity: Household
    dtype: Judgment
    period: Year
    source: Fylde Council Tax Reduction Scheme 2026-27 Class E and section 59.1
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: condition, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-9, excerpt: "amount A exceeds amount B"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'fylde_council_tax_reduction_working_age_scheme_applies and fylde_council_tax_reduction_capital_eligible and would_claim_council_tax_reduction and fylde_council_tax_reduction_award_before_standard_deduction_for_year > fylde_council_tax_reduction_capital_limit - fylde_council_tax_reduction_capital_limit'}]
  - name: fylde_council_tax_reduction_annual_amount
    kind: derived
    entity: Household
    dtype: Money
    period: Year
    unit: GBP
    source: Fylde Council Tax Reduction Scheme 2026-27 section 59.1 and Schedule 6
    metadata: {proof: {atoms: [{path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-73, excerpt: "deducting their excess income multiplied by the taper from their maximum council tax support"}}, {path: "versions[0].formula", kind: formula, source: {corpus_citation_path: uk-fylde/manual/council-tax-reduction-scheme-2026-2027/page-139, excerpt: "a percentage reduction of 22.7% will be made"}}]}}
    versions: [{effective_from: '2026-04-01', formula: 'if fylde_council_tax_reduction_award_conditions_met: fylde_council_tax_reduction_award_before_standard_deduction_for_year * (fylde_council_tax_reduction_maximum_support_rate - fylde_council_tax_reduction_standard_deduction_rate) else: fylde_council_tax_reduction_capital_limit - fylde_council_tax_reduction_capital_limit'}]
inputs:
  - {name: local_authority_is_fylde, entity: Household, dtype: Boolean, period: Year}
  - {name: council_tax_reduction_household_in_england, entity: Household, dtype: Boolean, period: Year}
  - {name: fylde_council_tax_reduction_applicant_is_not_pensioner, entity: Household, dtype: Boolean, period: Year}
  - {name: fylde_council_tax_reduction_applicant_or_partner_receives_income_support, entity: Household, dtype: Boolean, period: Year}
  - {name: fylde_council_tax_reduction_applicant_or_partner_receives_income_based_jobseekers_allowance, entity: Household, dtype: Boolean, period: Year}
  - {name: fylde_council_tax_reduction_applicant_or_partner_receives_income_related_employment_and_support_allowance, entity: Household, dtype: Boolean, period: Year}
  - {name: fylde_council_tax_reduction_applicant_or_partner_receives_universal_credit, entity: Household, dtype: Boolean, period: Year}
  - {name: would_claim_council_tax_reduction, entity: Household, dtype: Boolean, period: Year}
  - {name: fylde_council_tax_reduction_assessed_capital_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: fylde_council_tax_reduction_actual_liability_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: fylde_council_tax_reduction_assessed_income_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: fylde_council_tax_reduction_applicable_amount_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: fylde_council_tax_reduction_non_dependant_deductions_for_year, entity: Household, dtype: Money, period: Year, unit: GBP}
  - {name: fylde_council_tax_reduction_non_dependant_deduction_applies, entity: Person, dtype: Boolean, period: Week}
  - {name: fylde_council_tax_reduction_non_dependant_in_remunerative_work, entity: Person, dtype: Boolean, period: Week}
  - {name: fylde_council_tax_reduction_non_dependant_normal_gross_weekly_income, entity: Person, dtype: Money, period: Week, unit: GBP}
