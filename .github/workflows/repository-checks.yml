name: Repository Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Daily full-matrix validation: the honesty backstop for shard-on-demand.
    # Scoped pull requests validate only the one jurisdiction they touch, so
    # this scheduled run re-validates every shard against main to catch any
    # cross-shard drift a scoped PR could not see. 06:41 UTC.
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  workflow-toolchain:
    runs-on: ubuntu-latest
    # Staged metadata; these values are not inputs to the validation call.
    env:
      AXIOM_ENCODE_VERSION: "0.2.2211"
      AXIOM_COMPOSE_REF: b9606380e78733bf50d17a9c19043f63fcc8bd63
    steps:
      - name: Checkout rules repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install workflow parser
        run: python -m pip install PyYAML==6.0.3

      - name: Check workflow toolchain mirror
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import tomllib
          from pathlib import Path
          import yaml

          path = Path(".axiom/workflow-toolchain.toml")
          document = tomllib.loads(path.read_text())
          if set(document) != {"workflow_toolchain"}:
              raise SystemExit(f"{path}: expected only the workflow_toolchain table")
          toolchain = document["workflow_toolchain"]
          workflow = yaml.safe_load(Path(".github/workflows/repository-checks.yml").read_text())
          validation = workflow["jobs"]["validate"]
          metadata = workflow["jobs"]["workflow-toolchain"]["env"]
          shared = re.fullmatch(
              r"TheAxiomFoundation/\.github/\.github/workflows/validate-rulespec\.yml@([0-9a-f]{40})",
              validation["uses"],
          )
          if shared is None:
              raise SystemExit("workflow must pin the shared validation workflow to a full lowercase commit SHA")
          expected = {
              "axiom_encode_version": metadata["AXIOM_ENCODE_VERSION"],
              "axiom_compose_ref": metadata["AXIOM_COMPOSE_REF"],
              "shared_workflow_ref": shared[1],
          }
          for key in (
              "axiom_encode_ref",
              "axiom_rules_engine_ref",
              "axiom_corpus_ref",
              "rulespec_us_ref",
          ):
              expected[key] = validation["with"][key.replace("_", "-")]
          if not isinstance(toolchain, dict) or set(toolchain) != set(expected):
              raise SystemExit(f"{path}: expected exactly {', '.join(sorted(expected))}")
          for key, value in expected.items():
              pattern = r"[0-9]+\.[0-9]+\.[0-9]+" if key == "axiom_encode_version" else r"[0-9a-f]{40}"
              if not isinstance(value, str) or re.fullmatch(pattern, value) is None:
                  raise SystemExit(f"workflow: {key} must be a literal string matching {pattern}")
              if toolchain[key] != value:
                  raise SystemExit(f"{path}: {key} must match literal workflow value {value}")
          print("Workflow toolchain mirror matches repository-checks.yml.")
          PY

  validate:
    needs: workflow-toolchain
    uses: TheAxiomFoundation/.github/.github/workflows/validate-rulespec.yml@882c5f11545ec3343fc5ed170e01d65aa2c5bb3e
    secrets: inherit
    with:
      axiom-encode-ref: fa0da5e834214052cc8d9d381e25ff409dd1062f
      axiom-rules-engine-ref: 363c6a6c56f7ad130996b63f7a09cfd4c3d9b021
      axiom-corpus-ref: 9d174d88119fd6e6ace02d7c94eec7bb47e363f0
      rulespec-us-ref: 0f291b367bf7e15555f9973112278c5cbf221653
      validate-roots: auto
      run-generated-guard: true
      guard-programs-root: false

  drift-alarm:
    # Red-main alarm. A full validation runs on every push to main and on the
    # daily schedule; if either goes red, open (or refresh) a tracking issue so
    # cross-shard drift that a scoped PR let through can never accumulate
    # silently. Never fires for pull requests.
    needs: validate
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'push') && needs.validate.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or refresh the red-main validation alarm
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          title="Scheduled full RuleSpec validation is red on main"
          body="The full-matrix validation run failed on main (${EVENT_NAME}): ${RUN_URL}

          Shard-on-demand validates only the touched jurisdiction on pull
          requests, so a red full run on main is the signal that cross-shard
          drift reached main. Investigate the failing shard(s) in the run above,
          then close this issue once main is green again."
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title \"$title\"" --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" \
              --body "Still red on $(date -u +%Y-%m-%dT%H:%MZ) (${EVENT_NAME}): ${RUN_URL}"
            echo "Refreshed alarm issue #$existing"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
            echo "Opened new alarm issue"
          fi
